<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QPM Menu</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f0f2f5;
      font-family: Arial, sans-serif;
    }
    h1 {
      margin-bottom: 20px;
      color: #333;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 20px 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }
    li {
      /* Remove vertical margins if any */
    }
    a {
      text-decoration: none;
      color: #007bff;
      font-size: 18px;
      padding: 10px 20px;
      border: 2px solid #007bff;
      border-radius: 5px;
      transition: background-color 0.3s, color 0.3s;
    }
    a:hover {
      background-color: #007bff;
      color: #fff;
    }
  </style>
</head>
<body>
  <h1>Mugin Scholar entry points</h1>
  <ul>
    <li><a href="/entries/widgets/searchform.html">Searchform</a></li>
    <li><a href="/entries/widgets/searchstrings.html">Searchstrings</a></li>
    <li><a href="/entries/widgets/references.html">References</a></li>
    <li><a href="/entries/widgets/editor.html">Editor</a></li>
  </ul>
  <ul>
    <li><a id="searchform-local-api-link" data-widget-path="/entries/widgets/searchform.html" data-local-api-port="5173" href="/entries/widgets/searchform.html">Searchform (local API)</a></li>
    <li><a id="searchstrings-local-api-link" data-widget-path="/entries/widgets/searchstrings.html" data-local-api-port="5173" href="/entries/widgets/searchstrings.html">Searchstrings (local API)</a></li>
    <li><a id="references-local-api-link" data-widget-path="/entries/widgets/references.html" data-local-api-port="5173" href="/entries/widgets/references.html">References (local API)</a></li>
    <li><a id="editor-local-api-link" data-widget-path="/entries/widgets/editor.html" data-local-api-port="5173" href="/entries/widgets/editor.html">Editor (local API)</a></li>
  </ul>
  <ul>
    <li><a id="public-api-search-link" data-public-api-path="/public-api/" href="/public-api/">Search API</a></li>
    <li><a id="public-api-health-link" data-public-api-path="/public-api/v1/health.php" href="/public-api/v1/health.php">API health</a></li>
    <li><a id="public-api-openapi-link" data-public-api-path="/public-api/v1/openapi.yaml" href="/public-api/v1/openapi.yaml">API OpenAPI</a></li>
  </ul>
  <script>
    (function () {
      const links = document.querySelectorAll("a[data-widget-path][data-local-api-port]");
      links.forEach((link) => {
        const configuredPort = String(link.dataset.localApiPort || "").trim();
        const port = configuredPort || "5173";
        const widgetPath = String(link.dataset.widgetPath || "").trim();
        if (!widgetPath) return;
        const isCodespacesHost = /\.app\.github\.dev$/i.test(window.location.hostname);
        const localApiBase = isCodespacesHost
          ? `${window.location.origin}/backend/api`
          : `${window.location.protocol}//${window.location.hostname}:${port}/backend/api`;
        link.href = `${widgetPath}?apiBase=${encodeURIComponent(localApiBase)}`;
      });
      const publicApiOrigin = window.location.origin;
      document.querySelectorAll("a[data-public-api-path]").forEach((link) => {
        const apiPath = String(link.dataset.publicApiPath || "").trim();
        if (!apiPath) return;
        link.href = `${publicApiOrigin}${apiPath}`;
      });
    })();
  </script>
</body>
</html>
