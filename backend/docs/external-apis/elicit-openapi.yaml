    post:
      tags:
        - Library
      security:
        - BearerAuth: []
      summary: Save library sources
      description: >-
        Saves 1ÔÇô100 papers. Each item is one of: an `elicitId`; a `pdfUrls`
        entry, metadata optional; or a `title` with at least one of `doi`,
        `authors`, `year`, `venue`, `abstract`, `url`. A `doi` alone is
        rejected. Elicit fills missing metadata from its corpus or the parsed
        PDF. `pdfUrls` is how to attach a PDF: Elicit fetches and parses it in
        the background when the paper is not in the corpus. Do not download PDFs
        yourself; for local files, use imports.


        The response lists each item in request order. An item that matches a
        paper already in your library returns that source with `created: false`
        and `duplicateOf` set. With `onDuplicate: skip` (default), fields the
        existing source lacked are filled from the item and listed in
        `updatedFields`. Existing values do not change. Adding `pdfUrls`, `doi`,
        or `elicitId` to an existing source starts enrichment for it again. With
        `onDuplicate: create`, a copy is saved and the pair is recorded as a
        potential duplicate. `collectionIds` adds every returned source to those
        collections; each source's `collections` reports, per collection, the id
        the collection holds for the paper and whether this call added it. A
        group collection holds its own copy under a different id, so the
        returned source's `collectionIds` does not list it.


        Metadata and full text for new sources arrive asynchronously. A new
        source starts with `fullTextStatus: pending`. When `fullTextStatus`
        changes, enrichment is complete. A source that still has `title: null`
        at that point has an identifier that is not in the corpus.


        ### Example


        ```bash

        curl -X POST https://elicit.com/api/v2/library/sources \
          -H "Authorization: Bearer elk_live_your_key_here" \
          -H "Content-Type: application/json" \
          -d '{"sources":[{"title":"Semaglutide and cardiovascular outcomes in obesity without diabetes","doi":"10.1056/NEJMoa2307563"},{"title":"Attention Is All You Need","authors":["Ashish Vaswani"],"year":2017}],"collectionIds":["b458052a-84e2-4e47-b5c4-00e11390a265"]}'
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sources:
                  type: array
                  items:
                    $ref: '#/components/schemas/CreateLibrarySourceItem'
                  minItems: 1
                  maxItems: 100
                collectionIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  maxItems: 100
                  description: >-
                    Collections you own or can edit to add every returned source
                    to, duplicates included.
                onDuplicate:
                  type: string
                  enum:
                    - skip
                    - create
                  description: >-
                    skip (default): an item matching an already-saved source
                    returns that source, updating any fields it lacked, instead
                    of creating one. create: saves anyway and records a
                    potential-duplicate pair for the app's review-duplicates
                    flow.
