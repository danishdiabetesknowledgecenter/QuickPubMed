  /sessions/reports:
    post:
      tags:
        - Reports
      summary: Create a new report
      description: >-
        Start an asynchronous report generation job. Elicit will search for
        relevant papers, screen them for relevance, extract structured data, and
        produce a full research report.


        Reports are long-running operations (typically 5ÔÇô15 minutes). The
        response includes a `sessionId` and a `links.self` URL that you poll for
        status.


        The report is also visible at the `url` returned in the response, where
        you can watch it progress in real time.


        ### Workflow


        1. **POST /api/v2/sessions/reports** ÔÇö submit your research question
        (returns immediately with `sessionId`)

        2. **GET `links.self`** (`/api/v2/sessions/reports/:sessionId`) ÔÇö poll
        while `status` is `processing`. If it becomes
        `pausedForInsufficientQuota`, resolve the usage limit and POST to
        `links.resume` before continuing.

        3. When complete, use the available `pdfUrl` and `docxUrl` fields to
        download the report, and `txtUrl`, `bibUrl`, and `risUrl` for its
        reference list (APA text, BibTeX, and RIS). Check `exportsStatus` for
        reference-list availability; these URLs are not guaranteed to be present
        immediately.


        ### Example


        ```bash

        # 1. Create the report

        curl -X POST https://elicit.com/api/v2/sessions/reports \
          -H "Authorization: Bearer elk_live_your_key_here" \
          -H "Content-Type: application/json" \
          -d '{"researchQuestion": "What are the effects of GLP-1 receptor agonists on cardiovascular outcomes?"}'

        # 2. Poll while status is "processing"; resolve quota pauses before
        resuming

        curl https://elicit.com/api/v2/sessions/reports/{sessionId} \
          -H "Authorization: Bearer elk_live_your_key_here"
        ```
      security:
        - BearerAuth: []
      requestBody:
        required: true
        description: Report configuration
        content:
          application/json:
            schema:
              type: object
              properties:
                researchQuestion:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: >-
                    The research question to investigate. Elicit will search for
                    relevant papers, screen them, and extract data to produce a
                    structured report.
                  example: >-
                    What are the effects of GLP-1 receptor agonists on
                    cardiovascular outcomes?
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: >-
                    Optional title for the report. If provided, Elicit will use
                    this as the report title instead of generating one
                    automatically from the research question.
                  example: GLP-1 Receptor Agonists and Cardiovascular Outcomes
                maxSearchPapers:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  default: 50
                  description: >-
                    Maximum number of papers to retrieve during the search
                    phase. More papers means a more comprehensive but slower
                    report. Defaults to 50.
                  example: 50
                maxExtractPapers:
                  type: integer
                  minimum: 1
                  maximum: 80
                  default: 10
                  description: >-
                    Maximum number of papers to include in the final extraction
                    table. Papers are screened for relevance before extraction.
                    Defaults to 10.
                  example: 10
                isPublic:
                  type: boolean
                  default: false
                  description: >-
                    Whether the report should be publicly accessible via its URL
                    without authentication. Defaults to false.
                  example: false
              required:
                - researchQuestion
            examples:
              basic:
                summary: Basic report
                value:
                  researchQuestion: >-
                    What are the effects of GLP-1 receptor agonists on
                    cardiovascular outcomes?
              customized:
                summary: Report with custom paper limits
                value:
                  researchQuestion: >-
                    What is the evidence for cognitive behavioral therapy in
                    treating insomnia?
                  maxSearchPapers: 1000
                  maxExtractPapers: 80
              publicReport:
                summary: Public report
                value:
                  researchQuestion: >-
                    What are the effects of GLP-1 receptor agonists on
                    cardiovascular outcomes?
                  isPublic: true
              withTitle:
                summary: Report with custom title
                value:
                  researchQuestion: >-
                    What are the effects of GLP-1 receptor agonists on
                    cardiovascular outcomes?
                  title: GLP-1 Receptor Agonists and Cardiovascular Outcomes
      responses:
        '202':
          description: >-
            Report creation accepted. The report is now being generated
            asynchronously. Poll `links.self` for status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSessionCreated'
              example:
                type: report
                sessionId: 5ad08bfb-cbe0-4911-a8c3-309760d33029
                status: processing
                url: https://elicit.com/review/5ad08bfb-cbe0-4911-a8c3-309760d33029
                isPublic: false
                links:
                  self: https://elicit.com/api/v2/sessions/reports/5ad08bfb-cbe0-4911-a8c3-309760d33029
        '400':
          description: >-
            Invalid request. Check that `researchQuestion` is present and within
            length limits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_request
                  message: researchQuestion is required
        '401':
          description: >-
            Authentication failed. The API key is missing, invalid, revoked, or
            expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_api_key
                  message: Invalid API key
        '402':
          description: Insufficient quota.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: insufficient_quota
                  message: Insufficient quota.
        '403':
          description: >-
            API access is not available on your current plan. Upgrade to Pro or
            above to use the API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: api_access_denied
                  message: >-
                    API access is not available on your current plan. Please
                    upgrade to Pro or above.
        '429':
          description: >-
            Rate limit exceeded. More than 100 requests per minute were received
            from your IP address; further requests are blocked for 5 minutes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudflareRateLimitError'
              example:
                error: Rate limit exceeded
                message: Too many requests. Please try again later.
        '500':
          description: >-
            An unexpected error occurred. Retry reads with backoff; before
            retrying a write, check whether it took effect. See Error Handling
            for retry guidance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: internal_error
                  message: Internal server error
  /sessions/reports/{sessionId}:
    get:
      tags:
        - Reports
      summary: Get report status and results
      description: >-
        Poll the status of a report created via `POST /api/v2/sessions/reports`.


        ### Status transitions


        - **processing** ÔÇö Elicit is actively searching, screening, and
        extracting data. You can watch progress in real time at the `url`.

        - **pausedForInsufficientQuota** ÔÇö The account exceeded its usage limit
        mid-run. The report stays paused until resumed via the `links.resume`
        URL (or the Elicit web interface) once the limit is resolved.

        - **completed** ÔÇö The report is finished. The `result` field contains
        the report content.

        - **failed** ÔÇö Something went wrong. The `error` field contains details.

        - **unknown** ÔÇö Status is not tracked for this report (legacy or
        user-created reports).


        ### Polling recommendation


        Poll every 30ÔÇô60 seconds. Reports typically complete in 5ÔÇô15 minutes
        depending on the number of papers.


        ### Including the full report body


        By default, `result.reportBody` and `result.abstract` are omitted to
        keep polling responses lightweight. To include them, add
        `?include=reportBody` to the request.


        ### Download availability


        Download URLs are optional and expire after 7 days; fetch this endpoint
        again for fresh URLs. `exportsStatus` describes the reference-list
        exports (`txtUrl`, `bibUrl`, `risUrl`), not PDF/DOCX. `ready` means a
        cached export manifest was served, which can be stale; it does not prove
        that missing formats have no export. `generating` or `unavailable` means
        no cached downloads can be served yet.


        If expected reference-list URLs are missing, wait at least 60 seconds
        and repeat this GET, even after `status: "completed"` and
        `exportsStatus: "ready"`. Cached manifests are reused for a 60-second
        cooldown, and older manifests can also be served during generation or
        upstream failures. One retry is not a freshness guarantee: use bounded
        retries with backoff, then report that the expected downloads remain
        unavailable instead of concluding they do not exist.


        ### Example


        ```bash

        # Poll for status

        curl https://elicit.com/api/v2/sessions/reports/{sessionId} \
          -H "Authorization: Bearer elk_live_your_key_here"

        # Fetch with full report body

        curl
        "https://elicit.com/api/v2/sessions/reports/{sessionId}?include=reportBody"
        \
          -H "Authorization: Bearer elk_live_your_key_here"
        ```
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: sessionId
          description: >-
            The session ID (UUID) returned by the create endpoints and `GET
            /sessions`
          schema:
            type: string
            format: uuid
            description: >-
              The session ID (UUID) returned by the create endpoints and `GET
              /sessions`
            example: 5ad08bfb-cbe0-4911-a8c3-309760d33029
          required: true
        - in: query
          name: include
          description: >-
            Set to 'reportBody' to include the full report markdown and abstract
            in the response
          schema:
            type: string
            const: reportBody
            description: >-
              Set to 'reportBody' to include the full report markdown and
              abstract in the response
      responses:
        '200':
          description: Report status and results (if completed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSessionDetail'
              examples:
                processing:
                  summary: Report is being generated
                  value:
                    type: report
                    sessionId: 5ad08bfb-cbe0-4911-a8c3-309760d33029
                    status: processing
                    executionStage: gathering_sources
                    url: https://elicit.com/review/5ad08bfb-cbe0-4911-a8c3-309760d33029
                    isPublic: false
                    links:
                      self: https://elicit.com/api/v2/sessions/reports/5ad08bfb-cbe0-4911-a8c3-309760d33029
                completed:
                  summary: Report completed with results (include=reportBody)
                  value:
                    type: report
                    sessionId: 5ad08bfb-cbe0-4911-a8c3-309760d33029
                    status: completed
                    executionStage: done
                    exportsStatus: ready
                    url: https://elicit.com/review/5ad08bfb-cbe0-4911-a8c3-309760d33029
                    isPublic: false
                    result:
                      title: >-
                        GLP-1 Receptor Agonists and Cardiovascular Outcomes: A
                        Systematic Review
                      summary: >-
                        This review analyzed 42 studies examining the
                        cardiovascular effects of GLP-1 receptor agonists. The
                        evidence suggests significant reductions in major
                        adverse cardiovascular events (MACE), with semaglutide
                        showing the strongest effect (HR 0.74, 95% CI
                        0.58-0.95). Liraglutide also demonstrated cardiovascular
                        benefit in the LEADER trial (HR 0.87, 95% CI 0.78-0.97).
                        Most studies were industry-funded RCTs with follow-up
                        periods of 2-5 years.
                      reportBody: >-
                        # Introduction


                        GLP-1 receptor agonists have emerged as a major
                        therapeutic class...


                        # Methods


                        We conducted a systematic review of randomized
                        controlled trials...
                      abstract: >-
                        This systematic review examines the cardiovascular
                        effects of GLP-1 receptor agonists across 42 studies...
                    pdfUrl: https://s3.amazonaws.com/...
                    docxUrl: https://s3.amazonaws.com/...
                    txtUrl: https://s3.amazonaws.com/...
                    bibUrl: https://s3.amazonaws.com/...
                    risUrl: https://s3.amazonaws.com/...
                    links:
                      self: https://elicit.com/api/v2/sessions/reports/5ad08bfb-cbe0-4911-a8c3-309760d33029
                failed:
                  summary: Report generation failed
                  value:
                    type: report
                    sessionId: 5ad08bfb-cbe0-4911-a8c3-309760d33029
                    status: failed
                    executionStage: extracting_data
                    url: https://elicit.com/review/5ad08bfb-cbe0-4911-a8c3-309760d33029
                    isPublic: false
                    links:
                      self: https://elicit.com/api/v2/sessions/reports/5ad08bfb-cbe0-4911-a8c3-309760d33029
                    error:
                      code: report_generation_failed
                      message: >-
                        Report generation failed during the extraction phase.
                        Please try again.
        '400':
          description: The request body, query parameters, or path ID failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_request
                  message: Invalid request
        '401':
          description: >-
            Authentication failed. The API key is missing, invalid, revoked, or
            expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_api_key
                  message: Invalid API key
        '403':
          description: >-
            API access is not available on your current plan. Upgrade to Pro or
            above to use the API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: api_access_denied
                  message: >-
                    API access is not available on your current plan. Please
                    upgrade to Pro or above.
        '404':
          description: >-
            Report not found, has a different session type, or belongs to a
            different user. A malformed session ID returns 400.
          content:
