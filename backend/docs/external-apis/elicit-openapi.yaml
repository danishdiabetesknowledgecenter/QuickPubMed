  /projects:
    get:
      tags:
        - Projects
      security:
        - BearerAuth: []
      summary: List projects
      description: >-
        Returns the projects you own and those shared with you, most recently
        updated first. A project shared with you is listed as soon as it is
        shared ÔÇö you do not have to open it in the web interface first.


        Default page size 50, maximum 100. `totalCount` counts every project you
        can see, not the page.


        `nextCursor` is the last project on the page, and the ordering is by
        `updatedAt`, so a cursor is only valid against a stable set: paging
        again after that project was deleted or unshared returns `400`, and a
        project updated between two requests moves to the front, where a later
        page will not show it. For a consistent snapshot, page through without
        pausing, or restart from the first page.


        ### Example


        ```bash

        curl https://elicit.com/api/v2/projects \
          -H "Authorization: Bearer elk_live_your_key_here"
        ```
      parameters:
        - in: query
          name: limit
          description: 'Maximum number of projects to return (default: 50, max: 100)'
          schema:
            type: integer
            minimum: 1
            maximum: 100
            description: 'Maximum number of projects to return (default: 50, max: 100)'
            example: 20
        - in: query
          name: cursor
          description: >-
            Pagination cursor from a previous response's nextCursor. Omit for
            the first page. The cursor is the id of the last project on the
            previous page, and the list is ordered by `updatedAt`, so it is only
            stable while the set is: if that project is deleted or unshared
            before you page again the request returns 400, and a project updated
            between pages moves to the front and can be missed. Restart from the
            first page if either matters.
