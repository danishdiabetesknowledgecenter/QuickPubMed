  /projects/{projectId}/shares:
    post:
      tags:
        - Projects
      security:
        - BearerAuth: []
      summary: Share a project
      description: >-
        Shares the project read-only with an email address. Owner-only.


        If the email has an Elicit account, they get read access immediately and
        `status` is `registered`. Otherwise a pending invitation is created and
        `status` is `invited`; inviting people without an account requires that
        your plan allows it.


        An email that already has edit access keeps it: nothing is downgraded,
        and the response reports their `role` as `writer`. Repeating a share is
        safe, including for a recipient whose organization also has edit access
        to the project.


        A `400` means the request can't produce a share: `self_share` for your
        own address, `already_has_org_access` when the recipient's organization
        already has edit access to the project so a read-only share would do
        nothing. A `403` means the share is not allowed: `cap_exceeded` when the
        project has reached its recipient limit, `gate_denied` when your plan
        cannot invite people without an Elicit account.


        ### Example


        ```bash

        curl -X POST https://elicit.com/api/v2/projects/{projectId}/shares \
          -H "Authorization: Bearer elk_live_your_key_here" \
          -H "Content-Type: application/json" \
          -d '{"email": "colleague@example.com"}'
        ```
      parameters:
        - in: path
          name: projectId
          description: The project ID (UUID) from `GET /projects`
          schema:
            type: string
            format: uuid
            description: The project ID (UUID) from `GET /projects`
            example: 9c1f6a7e-5d24-4a3b-9f0e-1b2c3d4e5f60
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: >-
                    Email address to share the project with, as a read-only
                    recipient.
                  example: colleague@example.com
              required:
                - email
              additionalProperties: false
            example:
              email: colleague@example.com
      responses:
        '201':
          description: The share that now exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProjectShareResponse'
              example:
                projectId: 9c1f6a7e-5d24-4a3b-9f0e-1b2c3d4e5f60
                share:
                  email: colleague@example.com
                  status: registered
                  role: reader
                url: https://elicit.com/project/9c1f6a7e-5d24-4a3b-9f0e-1b2c3d4e5f60
        '400':
          description: The request cannot produce a share.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_request:
                  value:
                    error:
                      code: invalid_request
                      message: 'body.email: Invalid email'
                self_share:
                  value:
                    error:
                      code: self_share
                      message: Cannot share a resource with yourself
                already_has_org_access:
                  value:
                    error:
                      code: already_has_org_access
                      message: >-
                        colleague@example.com already has edit access through
                        your organization
        '401':
          description: >-
            Authentication failed. The API key is missing, invalid, revoked, or
            expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid:
                  summary: Invalid, revoked, or expired key
                  value:
                    error:
                      code: invalid_api_key
                      message: Invalid API key
                missing:
                  summary: No Authorization header
                  value:
                    error:
                      code: missing_authorization
                      message: Authorization header is required
        '403':
          description: >-
            API access is unavailable, the project's recipient limit was
            reached, or the plan cannot invite people without an Elicit account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                apiAccess:
                  value:
                    error:
                      code: api_access_denied
                      message: >-
                        API access is not available on your current plan. Please
