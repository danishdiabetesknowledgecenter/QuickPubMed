        executionStage:
          type:
            - string
            - 'null'
          enum:
            - gathering_sources
            - screening_abstract
            - screening_fulltext
            - extracting_data
            - generating_report
            - done
            - null
          description: The stage the session resumed at
          example: screening_abstract
        url:
          type: string
          description: URL to view this session in the Elicit web interface
        isPublic:
          type: boolean
        links:
          $ref: '#/components/schemas/SessionLinks'
      required:
        - type
        - sessionId
        - status
        - executionStage
        - url
        - isPublic
        - links
    CreateSessionShareResponse:
      type: object
      properties:
        sessionId:
          type: string
          description: Unique identifier for the session.
        share:
          $ref: '#/components/schemas/SessionShare'
        url:
          type: string
          description: >-
            URL to view the session in the Elicit web interface. Available
            actions depend on your permissions.
      required:
        - sessionId
        - share
        - url
    SessionShare:
      type: object
      properties:
        email:
          type: string
          description: Email address the session is shared with.
          example: colleague@example.com
        status:
          type: string
          enum:
            - registered
            - invited
          description: >-
            "registered" when the recipient already has an Elicit account and
            can read the session now; "invited" when a pending invitation was
            created for an email without an account.
        role:
          type: string
          const: reader
          description: >-
            Read-only access requested through this API. Creating a share
            preserves any existing editor/reviewer permissions, so this field is
            not a complete description of effective access.
      required:
        - email
        - status
        - role
    ListSessionSharesResponse:
      type: object
      properties:
        sessionId:
          type: string
          description: Unique identifier for the session.
        shares:
          type: array
          items:
            $ref: '#/components/schemas/SessionShare'
          description: >-
            Read-only recipients and pending read-only invitations. Existing
            editors and reviewers are not listed; manage those collaborators in
            the web interface.
        url:
          type: string
          description: >-
            URL to view the session in the Elicit web interface. Available
            actions depend on your permissions.
      required:
        - sessionId
        - shares
        - url
    DeleteSessionShareResponse:
      type: object
      properties:
        sessionId:
          type: string
          description: Unique identifier for the session.
        email:
          type: string
          description: Email address whose share was revoked.
        revoked:
          type: boolean
          description: >-
            Whether an existing direct share or pending invite was removed,
            regardless of role (reader, editor, or reviewer). False when nothing
            was removed; absence from the read-only share list does not imply
            false. Repeating the call is idempotent.
      required:
        - sessionId
        - email
        - revoked
    GetUsageResponse:
      type: object
      properties:
        hasUsageRemaining:
