  /files:
    post:
      tags:
        - Research Agent
        - Library
      summary: Upload a file
      description: >-
        Stage a file so it can be attached to a Research Agent turn or imported
        into your library. This is a two-step, presigned upload:


        1. **POST /api/v2/files** with the filename, MIME type, and exact byte
        size. The response returns a `file_id` and a short-lived presigned
        `upload_url`.

        2. **PUT** the raw file bytes to `upload_url` with the same
        `Content-Type` and a `Content-Length` matching `size_bytes`. Do not send
        an `Authorization` header on the PUT ÔÇö the URL is already signed.


        Then either pass `{ "file_id": "..." }` in the `attachments` array of a
        create-session or send-message request ÔÇö attached files are made
        available to the agent exactly as uploads made in the web interface are
        ÔÇö or pass the `file_id` in `fileIds` to `POST /api/v2/library/imports`
        to parse the PDF into your library. A staged file can be claimed by one
        session or one library import. Once attached to a session, the same
        `file_id` can be referenced again in later turns of that session,
        including after the staging expiry; it cannot be reused in another
        session or import.


        The request/response fields for this endpoint are deliberately
        `snake_case` (`content_type`, `size_bytes`, `file_id`, `upload_url`,
        `expires_at`), unlike the camelCase used elsewhere in the v2 surface.
        Files are capped at 30 MB, and a session accepts at most 20 distinct
        files across all turns. Upload the bytes and make the first claim within
        30 minutes: `upload_url` and an **unclaimed** `file_id` expire at
        `expires_at`. A claimed attachment is not subject to that staging
        expiry.


        ### Example


        ```bash

        # 1. Register the upload

        curl -X POST https://elicit.com/api/v2/files \
          -H "Authorization: Bearer elk_live_your_key_here" \
          -H "Content-Type: application/json" \
          -d '{"filename":"trial-results.pdf","content_type":"application/pdf","size_bytes":245678}'

        # 2. Upload the bytes to the returned upload_url

        curl -X PUT "{upload_url}" \
          -H "Content-Type: application/pdf" \
          --data-binary @trial-results.pdf

        # 3. Attach {"file_id": "..."} to a create-session or /messages request,

        #    or import it with POST /library/imports {"fileIds": ["..."]}

        ```
      security:
        - BearerAuth: []
      requestBody:
        required: true
        description: File metadata for the presigned upload
        content:
          application/json:
            schema:
              type: object
              properties:
                filename:
                  type: string
                  minLength: 1
                  maxLength: 512
                  description: >-
                    Original filename of the upload. Used as the display name in
                    the session.
                  example: trial-results.pdf
                content_type:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: MIME type of the file.
                  example: application/pdf
                size_bytes:
                  type: integer
                  exclusiveMinimum: 0
                  maximum: 31457280
                  description: >-
                    Exact size of the file in bytes. Must match the uploaded
                    object exactly. Maximum 31457280 bytes (30 MB).
                  example: 245678
              required:
                - filename
                - content_type
                - size_bytes
      responses:
        '200':
          description: >-
            Upload registered. PUT the file bytes to `upload_url` before it
            expires.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateFileResponse'
              example:
                file_id: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                upload_url: https://s3.amazonaws.com/...
                expires_at: '2026-07-23T15:00:00.000Z'
        '400':
          description: >-
            Invalid request. The filename, content type, or size is missing or
            invalid, or the size exceeds the 30 MB limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_request
                  message: Invalid request
        '401':
          description: >-
            Authentication failed. The API key is missing, invalid, revoked, or
            expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid:
                  summary: Invalid, revoked, or expired key
                  value:
                    error:
                      code: invalid_api_key
                      message: Invalid API key
                missing:
                  summary: No Authorization header
                  value:
                    error:
                      code: missing_authorization
                      message: Authorization header is required
        '403':
          description: API access is unavailable, or uploads are disabled for this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                apiAccess:
                  value:
                    error:
                      code: api_access_denied
                      message: >-
                        API access is not available on your current plan. Please
                        upgrade to Pro or above.
                uploadsDisabled:
                  value:
                    error:
                      code: uploads_disabled
                      message: File uploads are not enabled for this account.
        '429':
          description: >-
            Rate limit exceeded. More than 100 requests per minute were received
            from your IP address; further requests are blocked for 5 minutes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudflareRateLimitError'
              example:
                error: Rate limit exceeded
                message: Too many requests. Please try again later.
        '500':
          description: >-
            An unexpected error occurred. Retry reads with backoff; before
            retrying a write, check whether it took effect. See Error Handling
            for retry guidance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: internal_error
                  message: Internal server error
