            - generating_report
            - done
            - null
          description: >-
            Current pipeline stage. Advances through gathering_sources ÔåÆ
            screening_abstract ÔåÆ screening_fulltext ÔåÆ extracting_data ÔåÆ
            generating_report ÔåÆ done. Null when the stage isn't known ÔÇö treat it
            as unknown, not as not-started.
        url:
          type: string
          description: URL to view the review in the Elicit web interface
        isPublic:
          type: boolean
          description: >-
            Whether the review is publicly accessible via its URL without
            authentication
        error:
          type: object
          properties:
            code:
              type: string
              description: Machine-readable error code
            message:
              type: string
              description: Human-readable error message
          required:
            - code
            - message
          description: Error details, only present when status is failed
        data:
          $ref: '#/components/schemas/ReviewData'
          description: >-
            Stage-organized content and export URLs: per-stage
            `search`/`screen`/`fulltext`/`extract` CSV + XLSX downloads and
            `report` content plus pdf/docx/txt/bib/ris downloads. Cached
            downloads can lag behind current stage outputs even when
            `exportsStatus` is `ready`; absence does not prove a stage did not
            run. Repoll after at least 60 seconds for missing expected exports,
            including after completion, using bounded retries with backoff.
        dataFreshness:
          type:
            - string
            - 'null'
          description: >-
            ISO timestamp of the cached export manifest used for this response,
            or null when no timestamp is available for the returned data. An
            unchanged timestamp can indicate a stale cache; the timestamp alone
            does not guarantee that every completed stage is exported.
        exportsStatus:
          type: string
          enum:
            - ready
            - generating
            - unavailable
          description: >-
            Availability of cached export download URLs in `data`. `ready`: a
            cached manifest was served; it can be stale, including during
            regeneration or failures, and does not guarantee a complete current
            export set. If expected URLs are missing, repoll after at least 60
            seconds with bounded backoff, even after completion. `generating`:
            exports are being generated and no cached downloads can be served.
            `unavailable`: export generation or retrieval failed and no cached
            downloads can be served; structured report content may still be
            available.
        links:
          $ref: '#/components/schemas/SessionLinks'
      required:
        - type
        - sessionId
        - status
        - executionStage
        - url
        - isPublic
        - dataFreshness
        - exportsStatus
        - links
    ReviewData:
      type: object
      properties:
        search:
          $ref: '#/components/schemas/StageData'
          description: Gather-stage paper list exports.
        screen:
          $ref: '#/components/schemas/StageData'
          description: Abstract-screening results exports.
        fulltext:
          $ref: '#/components/schemas/StageData'
          description: Fulltext-screening results exports.
        extract:
          $ref: '#/components/schemas/StageData'
          description: Extraction-stage results exports.
        report:
          $ref: '#/components/schemas/ReportData'
          description: Report-stage content and exports.
    StageData:
      type: object
      properties:
        csv:
          type: string
          format: uri
          description: Presigned URL for the CSV export. Expires in 7 days.
        xlsx:
          type: string
          format: uri
          description: Presigned URL for the XLSX export. Expires in 7 days.
      required:
        - csv
        - xlsx
    ReportData:
      type: object
      properties:
        result:
          $ref: '#/components/schemas/ReviewResult'
          description: >-
            Structured report content (title, summary, optional body +
            abstract).
        pdf:
          type: string
          format: uri
          description: Presigned URL for the report PDF. Expires in 7 days.
        docx:
          type: string
          format: uri
          description: Presigned URL for the report DOCX. Expires in 7 days.
        txt:
          type: string
          format: uri
          description: >-
            Presigned URL for an APA-style plain-text reference list of the
            papers synthesized in the report. Expires in 7 days.
        bib:
          type: string
          format: uri
          description: >-
            Presigned URL for a BibTeX bibliography of the papers synthesized in
            the report. Expires in 7 days.
        ris:
          type: string
          format: uri
          description: >-
            Presigned URL for a RIS bibliography of the papers synthesized in
            the report. Expires in 7 days.
      required:
        - result
    ReviewResult:
      type: object
      properties:
        title:
          type: string
          description: Auto-generated title
        summary:
          type: string
          description: AI-generated executive summary of the findings
        reportBody:
          type:
            - string
            - 'null'
          description: >-
            Full report content in markdown format. Only included when
            ?include=reportBody is specified.
        abstract:
          type:
            - string
            - 'null'
          description: >-
            Report abstract in markdown format. Only included when
            ?include=reportBody is specified.
      required:
        - title
        - summary
    ListSessionsResponse:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/SessionListItem'
          description: >-
            Reports, systematic reviews, and research-agent sessions
            interleaved, ordered by creation date (newest first)
        nextCursor:
          type:
            - string
            - 'null'
          description: >-
            Opaque cursor for the next page; pass it back as `cursor`. Null if
            there are no more results.
          example: 2025-06-15T14:30:00.000Z_5ad08bfb-cbe0-4911-a8c3-309760d33029
        totalCount:
          type: integer
          description: Total sessions matching the filters across all pages.
      required:
        - sessions
        - nextCursor
        - totalCount
    SessionListItem:
      type: object
      properties:
        type:
          type: string
          enum:
            - report
            - systematicReview
            - agent
          description: >-
            Which kind of session this is; use it to pick the matching typed get
            endpoint
        sessionId:
          type: string
          format: uuid
          description: >-
            The session ID (UUID) returned by the create endpoints and `GET
            /sessions`
          example: 5ad08bfb-cbe0-4911-a8c3-309760d33029
        status:
          type: string
          enum:
            - processing
            - pausedForInsufficientQuota
            - completed
            - failed
            - unknown
          description: Current status of the report
        executionStage:
          type:
            - string
            - 'null'
          enum:
            - gathering_sources
            - screening_abstract
            - screening_fulltext
            - extracting_data
            - generating_report
            - done
            - null
          description: >-
            Current pipeline stage, or null when not yet known. Omitted entirely
            for agent sessions, which have no pipeline stages.
        title:
          type: string
          description: Report title (the research question)
          example: >-
            What are the effects of GLP-1 receptor agonists on cardiovascular
            outcomes?
        url:
          type: string
          description: URL to view the report in the Elicit web interface
          example: https://elicit.com/review/5ad08bfb-cbe0-4911-a8c3-309760d33029
        source:
          type: string
          enum:
            - user
            - api
            - mcp
            - agent_session
          description: How the report was created
          example: api
        createdAt:
          type: string
          description: ISO 8601 timestamp of when the report was created
          example: '2025-06-15T14:30:00.000Z'
        isPublic:
          type: boolean
          description: >-
            Whether the report is publicly accessible via its URL without
            authentication
          example: false
        role:
          type: string
          enum:
            - owner
            - shared
          description: >-
            The caller's relationship to this session: "owner" for a session the
