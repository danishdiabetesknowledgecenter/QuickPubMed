    post:
      tags:
        - Research Agent
      summary: Stop a Research Agent session
      description: >-
        Request an asynchronous interrupt using the same stop action as the
        Elicit web interface.


        Stopping does not delete or permanently close the session. The session
        remains visible and may be continued later. When the response status is
        `stopping`, poll the events endpoint until a `session_stopped` event
        appears.


        The operation is idempotent. If the session is already stopped or
        failed, it returns the existing state with `200 OK`.


        ### Example


        ```bash

        curl -X POST https://elicit.com/api/v2/sessions/agents/{sessionId}/stop
        \
          -H "Authorization: Bearer elk_live_your_key_here"
        ```
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: sessionId
          schema:
            type: string
            format: uuid
          required: true
      responses:
        '200':
          description: The session had already stopped or failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StopAgentSessionResponse'
              examples:
                stopped:
                  summary: Already stopped
                  value:
                    sessionId: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                    status: stopped
                    url: https://elicit.com/agent/a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                failed:
                  summary: Already failed
                  value:
                    sessionId: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
