        Elicit web interface; every active member of that organization holds the
        role it reports, and those members are **not** listed in `shares` unless
        they also hold an individual share of their own. A member who holds both
        is listed once, at the stronger of the two. `organization` is `null`
        when no organization currently reaches the project ÔÇö including when a
        share exists but that organization's plan no longer includes sharing,
        since its members have no access.


        ### Example


        ```bash

        curl https://elicit.com/api/v2/projects/{projectId}/shares \
          -H "Authorization: Bearer elk_live_your_key_here"
        ```
      parameters:
        - in: path
          name: projectId
          description: The project ID (UUID) from `GET /projects`
          schema:
            type: string
            format: uuid
            description: The project ID (UUID) from `GET /projects`
            example: 9c1f6a7e-5d24-4a3b-9f0e-1b2c3d4e5f60
          required: true
      responses:
        '200':
          description: The project's current shares.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProjectSharesResponse'
              example:
                projectId: 9c1f6a7e-5d24-4a3b-9f0e-1b2c3d4e5f60
                shares:
                  - email: colleague@example.com
                    status: registered
                    role: reader
                organization: null
                url: https://elicit.com/project/9c1f6a7e-5d24-4a3b-9f0e-1b2c3d4e5f60
        '400':
          description: >-
            A malformed id, or an unknown or invalid query parameter or body
            key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_request
                  message: 'params.projectId: Invalid uuid'
        '401':
          description: >-
            Authentication failed. The API key is missing, invalid, revoked, or
            expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid:
                  summary: Invalid, revoked, or expired key
                  value:
                    error:
                      code: invalid_api_key
                      message: Invalid API key
                missing:
                  summary: No Authorization header
                  value:
                    error:
                      code: missing_authorization
                      message: Authorization header is required
        '403':
          description: >-
            API access is not available on your current plan. Upgrade to Pro or
            above to use the API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: api_access_denied
                  message: >-
                    API access is not available on your current plan. Please
                    upgrade to Pro or above.
        '404':
          description: >-
            The project does not exist, or is not visible to you at the access
            this call needs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: project_not_found
                  message: Project not found
        '429':
          description: >-
            Rate limit exceeded. More than 100 requests per minute were received
            from your IP address; further requests are blocked for 5 minutes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudflareRateLimitError'
              example:
                error: Rate limit exceeded
                message: Too many requests. Please try again later.
        '500':
          description: >-
            An unexpected error occurred. Retry reads with backoff; before
            retrying a write, check whether it took effect. See Error Handling
            for retry guidance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: internal_error
                  message: Internal server error
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >-
        API key obtained from your Elicit account settings page. Keys use the
        format `elk_live_...`.
  schemas:
    PaperSearchRequest:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 2000
          description: The search query string
          example: GLP-1 receptor agonists for weight loss
        searchMode:
          type: string
          enum:
            - semantic
            - keyword
          default: semantic
          description: >-
            How to interpret `query`. `semantic` (default) runs Elicit's
            semantic search. `keyword` uses the corpus's native syntax:
            Lucene-style expressions for the Elicit index, PubMed query syntax
            for PubMed, or ClinicalTrials.gov advanced-search syntax for trials.
            Mutually exclusive with `filters` / `trialFilters` ÔÇö put filter
            expressions into the query string in keyword mode.
          example: semantic
        maxResults:
          type: integer
          minimum: 1
          maximum: 10000
          default: 10
          description: >-
            Maximum number of results to return (default 10; schema range
            1ÔÇô10000). Your plan may impose a lower per-request cap; exceeding it
            returns 400 invalid_request. Search returns up to this many results
            without pagination.
        corpus:
          type: string
          enum:
            - elicit
            - pubmed
          default: elicit
          description: >-
            Paper corpus to search. `elicit` (default) searches Elicit's full
            paper index; `pubmed` restricts to PubMed.
          example: elicit
        filters:
          $ref: '#/components/schemas/PaperFilters'
          description: Filters to narrow search results
      required:
        - query
    PaperFilters:
      type: object
      properties:
        minYear:
          type: integer
          description: Minimum publication year
          example: 2020
        maxYear:
          type: integer
          description: Maximum publication year
          example: 2025
        minEpochS:
          type: integer
          description: Minimum publication date as Unix epoch seconds
          example: 1672531200
        maxEpochS:
          type: integer
          description: Maximum publication date as Unix epoch seconds
          example: 1791484009
        maxQuartile:
          type: integer
          minimum: 1
          maximum: 4
          description: Maximum journal quartile (1 = top 25%)
          example: 2
        includeKeywords:
          type: array
          items:
            type: string
          description: Keywords that must appear in the paper
          example:
            - semaglutide
            - liraglutide
        excludeKeywords:
          type: array
          items:
            type: string
          description: Keywords to exclude from results
          example:
            - rodent
            - mouse model
        typeTags:
          type: array
          items:
            type: string
            enum:
              - Review
              - Meta-Analysis
              - Systematic Review
              - RCT
              - Longitudinal
          description: Filter by study type
          example:
            - RCT
            - Meta-Analysis
        hasPdf:
          type: boolean
          description: Only include papers with available PDFs
          example: false
        pubmedOnly:
          type: boolean
          description: Only include papers from PubMed
          example: false
        retracted:
          type: string
          enum:
            - exclude_retracted
            - include_retracted
            - only_retracted
          description: How to handle retracted papers. Defaults to exclude_retracted.
          example: exclude_retracted
    PaperSearchResponse:
      type: object
      properties:
        papers:
          type: array
          items:
            $ref: '#/components/schemas/Paper'
          description: Papers matching the query
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/SearchWarning'
          description: >-
            Non-fatal warnings emitted while executing the search (e.g. phrases
            ignored by the PubMed parser).
      required:
        - papers
    Paper:
      type: object
      properties:
        elicitId:
          type:
            - string
            - 'null'
          description: Elicit internal paper identifier
        title:
          type: string
          description: Paper title
        authors:
          type: array
          items:
            type: string
          description: List of author names
        year:
          type:
            - integer
            - 'null'
          description: Publication year
        abstract:
          type:
            - string
            - 'null'
          description: Paper abstract
        doi:
          type:
            - string
            - 'null'
          description: Digital Object Identifier
        pmid:
          type:
            - string
            - 'null'
          description: PubMed identifier
        venue:
          type:
            - string
            - 'null'
          description: Publication venue
        citedByCount:
          type:
            - integer
            - 'null'
          description: Number of citations this paper has received
        urls:
          type: array
          items:
            type: string
          description: URLs for the paper
        studyTypeTags:
          type: array
          items:
            type: string
          description: >-
            Study design tags (e.g. RCT, Meta-Analysis, Systematic Review,
            Review, Longitudinal). Populated for the `elicit` corpus; empty for
            the `pubmed` corpus.
        journalQuartile:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 4
          description: >-
            SJR journal quartile (1 = top 25%). Null when the journal is
            unranked/unknown or for the `pubmed` corpus.
        fullTextUrl:
          type:
            - string
            - 'null'
          description: Best available full-text / PDF link, or null when none is known.
      required:
        - elicitId
        - title
        - authors
        - year
        - abstract
        - doi
        - pmid
        - venue
        - citedByCount
        - urls
        - studyTypeTags
        - journalQuartile
        - fullTextUrl
    SearchWarning:
      type: object
      properties:
        corpus:
          type: string
          enum:
            - elicit
            - pubmed
            - clinical_trials
          description: Corpus that emitted the warning
        searchMode:
          type: string
          enum:
            - semantic
            - keyword
          description: Search mode in effect when the warning was emitted
        message:
          type: string
          description: Human-readable warning message
        warningDetails:
          $ref: '#/components/schemas/SearchWarningDetails'
      required:
        - corpus
        - searchMode
        - message
        - warningDetails
    SearchWarningDetails:
      type: object
      properties:
        type:
          type: string
          description: Warning category
        messages:
          type: array
          items:
            type: string
          description: Underlying warning messages
      required:
        - type
        - messages
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Machine-readable error code
              example: invalid_request
            message:
              type: string
              description: Human-readable error message
              example: Invalid search request
            sessionId:
              type: string
              format: uuid
              description: >-
                Recovery ID for an existing Research Agent session whose
                creation outcome is uncertain. Inspect this session before
                retrying creation. A subsequent confirmed pre-event
                initialization failure can roll it back, after which reads
                return session_not_found.
          required:
            - code
            - message
      required:
        - error
    CloudflareRateLimitError:
      type: object
      properties:
        error:
          type: string
          description: Error label. Always `Rate limit exceeded` for the burst limit.
          example: Rate limit exceeded
        message:
          type: string
          description: Human-readable detail.
          example: Too many requests. Please try again later.
      required:
        - error
        - message
    TrialSearchRequest:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 2000
          description: The search query string
          example: GLP-1 receptor agonists for weight loss
        searchMode:
          type: string
          enum:
            - semantic
            - keyword
          default: semantic
          description: >-
            How to interpret `query`. `semantic` (default) runs Elicit's
            semantic search. `keyword` uses the corpus's native syntax:
            Lucene-style expressions for the Elicit index, PubMed query syntax
            for PubMed, or ClinicalTrials.gov advanced-search syntax for trials.
            Mutually exclusive with `filters` / `trialFilters` ÔÇö put filter
            expressions into the query string in keyword mode.
          example: semantic
        maxResults:
          type: integer
          minimum: 1
          maximum: 10000
          default: 10
          description: >-
            Maximum number of results to return (default 10; schema range
            1ÔÇô10000). Your plan may impose a lower per-request cap; exceeding it
            returns 400 invalid_request. Search returns up to this many results
            without pagination.
        trialFilters:
          $ref: '#/components/schemas/TrialFilters'
          description: Clinical-trials filters (phase, recruitment status, results)
      required:
        - query
    TrialFilters:
      type: object
      properties:
        phase:
          type: array
          items:
            type: string
            enum:
              - NA
              - EARLY_PHASE1
              - PHASE1
              - PHASE2
              - PHASE3
              - PHASE4
          description: Clinical trial phases to include
          example:
            - PHASE2
            - PHASE3
        recruitmentStatus:
          type: array
          items:
            type: string
            enum:
              - ACTIVE_NOT_RECRUITING
              - COMPLETED
              - ENROLLING_BY_INVITATION
              - NOT_YET_RECRUITING
              - RECRUITING
              - SUSPENDED
              - TERMINATED
              - WITHDRAWN
              - AVAILABLE
          description: Trial recruitment statuses to include
          example:
            - RECRUITING
            - ACTIVE_NOT_RECRUITING
        hasResults:
          type: boolean
          description: Only include trials that have posted results
          example: true
    TrialSearchResponse:
      type: object
      properties:
        trials:
          type: array
          items:
            $ref: '#/components/schemas/Trial'
          description: Clinical trials matching the query
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/SearchWarning'
          description: Non-fatal warnings emitted while executing the search.
      required:
        - trials
    Trial:
      type: object
      properties:
        nctId:
          type: string
          description: NCT identifier for the trial
          example: NCT05646706
        title:
          type: string
          description: Trial title
        summary:
          type:
            - string
            - 'null'
          description: Plain-text trial description / brief summary
        url:
          type: string
          description: Link to the trial's public record
          example: https://clinicaltrials.gov/study/NCT05646706
        overallStatus:
          type:
            - string
            - 'null'
          description: >-
            Overall recruitment status (RECRUITING, COMPLETED, TERMINATED,
            etc.). Null when the trial has no status posted.
        phase:
          type: array
          items:
            type: string
          description: >-
            Trial phases (may list multiple, e.g. PHASE2 + PHASE3). Empty for
            N/A.
        studyType:
          type:
            - string
            - 'null'
          description: Study type (INTERVENTIONAL, OBSERVATIONAL, EXPANDED_ACCESS).
        enrollmentCount:
          type:
            - integer
            - 'null'
          description: Actual or anticipated enrollment count.
        conditions:
          type: array
          items:
            type: string
          description: Conditions / diseases being studied.
        interventions:
          type: array
          items:
            type: string
          description: Intervention names.
        leadSponsor:
          type:
            - string
            - 'null'
          description: Lead sponsor name.
        startDate:
          type:
            - string
            - 'null'
          description: Trial start date (ISO `YYYY-MM-DD` or partial).
        primaryCompletionDate:
          type:
            - string
            - 'null'
          description: Primary completion date (ISO `YYYY-MM-DD` or partial).
        completionDate:
          type:
            - string
            - 'null'
          description: Completion date (ISO `YYYY-MM-DD` or partial).
        hasResults:
          type:
            - boolean
            - 'null'
          description: Whether the trial has posted results.
        lastUpdatedYear:
          type:
            - integer
            - 'null'
          description: Year the trial record was last updated.
      required:
        - nctId
        - title
        - summary
        - url
        - overallStatus
        - phase
        - studyType
        - enrollmentCount
        - conditions
        - interventions
        - leadSponsor
        - startDate
        - primaryCompletionDate
        - completionDate
        - hasResults
        - lastUpdatedYear
    ReportSessionCreated:
      type: object
      properties:
        type:
          type: string
          const: report
        sessionId:
          type: string
          format: uuid
          description: >-
            The session ID (UUID) returned by the create endpoints and `GET
            /sessions`
          example: 5ad08bfb-cbe0-4911-a8c3-309760d33029
        status:
          type: string
          const: processing
          description: Initial status is always processing
        url:
          type: string
          description: URL to view the report in the Elicit web interface as it progresses
          example: https://elicit.com/review/5ad08bfb-cbe0-4911-a8c3-309760d33029
        isPublic:
          type: boolean
          description: >-
            Whether the report is publicly accessible via its URL without
            authentication
          example: false
        links:
          $ref: '#/components/schemas/SessionLinks'
      required:
        - type
        - sessionId
        - status
        - url
        - isPublic
        - links
    SessionLinks:
      type: object
      properties:
        self:
          type: string
          description: >-
            API URL for this session's full status and results (the typed get
            endpoint for its type)
          example: https://elicit.com/api/v2/sessions/reports/5ad08bfb-cbe0-4911-a8c3-309760d33029
        resume:
          type: string
          description: >-
            API URL to resume this session. Present only while the session is
            paused for insufficient quota. Only the owner can use it; a shared
            recipient receives 404 even when this link is present.
          example: https://elicit.com/api/v2/sessions/5ad08bfb-cbe0-4911-a8c3-309760d33029/resume
      required:
        - self
    ReportSessionDetail:
      type: object
      properties:
        type:
          type: string
          const: report
        sessionId:
          type: string
          format: uuid
          description: >-
            The session ID (UUID) returned by the create endpoints and `GET
            /sessions`
          example: 5ad08bfb-cbe0-4911-a8c3-309760d33029
        status:
          type: string
          enum:
            - processing
            - pausedForInsufficientQuota
            - completed
            - failed
            - unknown
          description: >-
            Current status of the report. Transitions: processing Ôçä
            pausedForInsufficientQuota (paused when the account exceeds its
            usage limit; stays paused until explicitly resumed via the resume
            endpoint or the Elicit web interface), processing ÔåÆ
            completed/failed. Poll until completed or failed.
        executionStage:
          type:
            - string
            - 'null'
          enum:
            - gathering_sources
            - screening_abstract
            - screening_fulltext
            - extracting_data
            - generating_report
            - done
            - null
          description: >-
            Current pipeline stage. Advances through gathering_sources ÔåÆ
            screening_abstract ÔåÆ extracting_data ÔåÆ generating_report ÔåÆ done.
            Null for reports created before this field was introduced or when
            the stage isn't known.
        url:
          type: string
          description: URL to view the report in the Elicit web interface
          example: https://elicit.com/review/5ad08bfb-cbe0-4911-a8c3-309760d33029
        isPublic:
          type: boolean
          description: >-
            Whether the report is publicly accessible via its URL without
            authentication
          example: false
        result:
          $ref: '#/components/schemas/ReportResult'
          description: Report output, only present when status is completed
        error:
          type: object
          properties:
            code:
              type: string
              description: Machine-readable error code
            message:
              type: string
              description: Human-readable error message
          required:
            - code
            - message
          description: Error details, only present when status is failed
        pdfUrl:
          type:
            - string
            - 'null'
          description: >-
            Pre-signed URL to download the report as PDF. Only present when
            status is completed and assets have been generated. Expires after 7
            days ÔÇö re-fetch the report for a fresh URL.
          example: https://s3.amazonaws.com/...
        docxUrl:
          type:
            - string
            - 'null'
          description: >-
            Pre-signed URL to download the report as DOCX. Only present when
            status is completed and assets have been generated. Expires after 7
            days ÔÇö re-fetch the report for a fresh URL.
          example: https://s3.amazonaws.com/...
        txtUrl:
          type:
            - string
            - 'null'
          description: >-
            Pre-signed URL to download the report's reference list as a
            plain-text (APA) file. Only present when status is completed and the
            report has a non-empty bibliography. Expires after 7 days ÔÇö re-fetch
            the report for a fresh URL.
          example: https://s3.amazonaws.com/...
        bibUrl:
          type:
            - string
            - 'null'
          description: >-
            Pre-signed URL to download the report's references as a BibTeX
            (.bib) file. Only present when status is completed and the report
            has a non-empty bibliography. Expires after 7 days ÔÇö re-fetch the
            report for a fresh URL.
          example: https://s3.amazonaws.com/...
        risUrl:
          type:
            - string
            - 'null'
          description: >-
            Pre-signed URL to download the report's references as an RIS (.ris)
            file. Only present when status is completed and the report has a
            non-empty bibliography. Expires after 7 days ÔÇö re-fetch the report
            for a fresh URL.
          example: https://s3.amazonaws.com/...
        exportsStatus:
          type: string
          enum:
            - ready
            - generating
            - unavailable
          description: >-
            Availability of cached reference-list exports
            (`txtUrl`/`bibUrl`/`risUrl`); `pdfUrl`/`docxUrl` are unaffected.
            Only present when status is completed. `ready`: a cached manifest
            was served, which can be stale; missing URLs do not prove a format
            has no export. Repoll after at least 60 seconds for expected missing
            URLs, using bounded retries with backoff. `generating`: exports are
            being generated and no cached downloads can be served.
            `unavailable`: export generation or retrieval failed and no cached
            downloads can be served.
        links:
          $ref: '#/components/schemas/SessionLinks'
      required:
        - type
        - sessionId
        - status
        - executionStage
        - url
        - isPublic
        - links
    ReportResult:
