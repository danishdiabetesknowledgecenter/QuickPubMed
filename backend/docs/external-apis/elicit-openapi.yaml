              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                capExceeded:
                  summary: Recipient cap reached
                  value:
                    error:
                      code: cap_exceeded
                      message: This session has reached its sharing limit
                gateDenied:
                  summary: Inviting non-account emails not available
                  value:
                    error:
                      code: gate_denied
                      message: Inviting people without an account is not available
        '404':
          description: >-
            The session does not exist or is not accessible to you for this
            operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: session_not_found
                  message: Session not found
        '429':
          description: >-
            Rate limit exceeded. More than 100 requests per minute were received
