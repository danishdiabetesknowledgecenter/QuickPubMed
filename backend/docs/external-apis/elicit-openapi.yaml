  /sessions/agents/{sessionId}/messages:
    post:
      tags:
        - Research Agent
      summary: Send a message to a Research Agent session
      description: >-
        Insert a follow-up message and start another asynchronous turn. Use
        messages to refine a result, answer the agent, redirect the research, or
        request another artifact.


        The response includes a `messageId`. The corresponding `user_message`
        event carries the same value, allowing the client to confirm delivery.


        Attach previously uploaded files by including their `file_id`s in the
        `attachments` array (see the Upload endpoint). A session can hold at
        most 20 distinct files across all turns; files already attached to this
        session can be referenced again without consuming another slot.


        If the session is paused for insufficient quota, resolve the usage limit
        and resume it via `POST /api/v2/sessions/:sessionId/resume` (or the
        Elicit web interface) before sending another message.


        ### Example


        ```bash

        curl -X POST
        https://elicit.com/api/v2/sessions/agents/{sessionId}/messages \
          -H "Authorization: Bearer elk_live_your_key_here" \
          -H "Content-Type: application/json" \
          -d '{"message":"Focus on randomized controlled trials only."}'
        ```
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: sessionId
          schema:
            type: string
            format: uuid
          required: true
      requestBody:
        required: true
        description: Follow-up message
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: >-
                    The message to insert into the running research agent
                    session.
                  example: Focus on randomized controlled trials only.
                attachments:
                  type: array
                  items:
                    type: object
                    properties:
                      file_id:
                        type: string
                        format: uuid
                        description: >-
                          The file_id returned by POST /api/v2/files for a
                          previously uploaded file.
                        example: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                    required:
                      - file_id
                  maxItems: 20
                  description: >-
                    Files to attach to this turn, each referencing a file_id
                    from POST /api/v2/files. A session can hold at most 20
                    distinct files across all turns. An already-attached file
                    can be referenced again in the same session, but not claimed
                    by another session or import. Duplicate file_ids within one
                    request are rejected.
              required:
                - message
      responses:
        '202':
          description: Message accepted. The session is processing another turn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostAgentSessionMessageResponse'
              example:
                sessionId: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                status: processing
                messageId: msg_8d9a5f42e7c64ba18bddca21
                url: https://elicit.com/agent/a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
        '400':
          description: >-
            Invalid request: query/message must contain 1ÔÇô2,000 characters and
            attachments must satisfy the schema (invalid_request). Attachment
            checks can also return file_not_uploaded if the upload cannot be
            verified, or file_size_mismatch if the uploaded byte length differs
            from size_bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_request
                  message: Invalid request
        '401':
          description: >-
            Authentication failed. The API key is missing, invalid, revoked, or
            expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid:
                  summary: Invalid, revoked, or expired key
                  value:
                    error:
                      code: invalid_api_key
                      message: Invalid API key
                missing:
                  summary: No Authorization header
                  value:
                    error:
                      code: missing_authorization
                      message: Authorization header is required
        '402':
          description: Insufficient quota.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: insufficient_quota
                  message: Insufficient quota.
        '403':
          description: >-
            API access is not available on your current plan. Upgrade to Pro or
