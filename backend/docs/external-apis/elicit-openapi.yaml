    CreateLibrarySourcesResponse:
      type: object
      properties:
        sources:
          type: array
          items:
            $ref: '#/components/schemas/CreatedLibrarySource'
      required:
        - sources
    CreatedLibrarySource:
      allOf:
        - $ref: '#/components/schemas/LibrarySource'
      properties:
        updatedFields:
          type: array
          items:
            type: string
          description: >-
            Fields this call populated on an already-saved source; empty when
            the source was created or nothing changed.
        created:
          type: boolean
          description: >-
            Whether this call saved a new source. False when the item matched an
            already-saved source under onDuplicate skip: that existing source is
            returned, with any fields it lacked populated from the item.
        duplicateOf:
          type:
            - string
            - 'null'
          format: uuid
          description: >-
            Id of the already-saved source this item matched, if any. Under
            onDuplicate create the returned source is the newly saved copy and
            the pair is recorded as a potential duplicate.
        collections:
          type: array
          items:
            type: object
            properties:
              collectionId:
                type: string
                format: uuid
              sourceId:
                type: string
                format: uuid
                description: >-
                  Id of this paper inside the collection. A group collection
                  keeps its own copy, so this differs from the returned source's
                  id; a personal collection holds the source itself.
              added:
                type: boolean
                description: >-
                  Whether this call added the paper. False when the collection
                  already had it; sourceId is then the paper already there.
            required:
              - collectionId
              - sourceId
              - added
          description: One entry per requested collectionId.
      required:
        - updatedFields
        - created
        - duplicateOf
        - collections
    GetLibrarySourceFullTextResponse:
      type: object
      properties:
        markdown:
          type: string
          description: The parsed paper ÔÇö title, abstract, and body ÔÇö as markdown.
      required:
        - markdown
    ListLibraryCollectionsResponse:
      type: object
      properties:
        collections:
          type: array
          items:
            $ref: '#/components/schemas/LibraryCollection'
        nextCursor:
          type:
            - string
            - 'null'
        totalCount:
          type: integer
      required:
        - collections
        - nextCursor
        - totalCount
    LibraryCollection:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        role:
          type: string
          enum:
            - owner
            - writer
            - reader
          description: >-
            Your access level. A reader can view the collection. A writer can
            also add and remove sources and edit the name and description. An
            owner can also delete the collection and change who it is shared
            with.
        kind:
          type: string
          enum:
            - personal
            - group
          description: >-
            `personal`: never shared; lists your own sources. `group`: has been
            shared at least once; owns copies of its sources, and stays a group
            collection.
        sharedVia:
          type: string
          enum:
            - direct
            - organization
          description: >-
            `direct` if the owner shared the collection with you. `organization`
            if the owner shared it with your organization. Absent on your own
            collections.
        sourceCount:
          type: integer
        links:
          type: object
          properties:
            self:
              type: string
              description: API URL of this collection.
            sources:
              type: string
              description: URL listing the sources in this collection.
          required:
            - self
            - sources
      required:
        - id
        - name
        - description
        - role
        - kind
        - sourceCount
        - links
    LibraryImport:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - processing
            - completed
        files:
          type: array
          items:
            type: object
            properties:
              fileId:
                type: string
                format: uuid
              filename:
                type: string
              status:
                type: string
                enum:
                  - pending
                  - created
                  - duplicate
                  - failed
              sourceId:
                type:
                  - string
                  - 'null'
                format: uuid
              duplicateOf:
                type:
                  - string
                  - 'null'
                format: uuid
                description: The already-saved source this file matched.
              error:
                type:
                  - object
                  - 'null'
                properties:
                  code:
                    type: string
                    enum:
                      - duplicate
                      - processing-error
                      - server-error
                      - invalid-file
                      - unknown
                  message:
                    type: string
                required:
                  - code
                  - message
                description: processing-error and server-error may succeed on retry.
            required:
              - fileId
              - filename
              - status
              - sourceId
              - duplicateOf
              - error
        createdAt:
          type: string
        completedAt:
          type:
            - string
            - 'null'
        links:
          type: object
          properties:
            self:
              type: string
              description: Poll this URL until status is completed.
          required:
            - self
      required:
        - id
        - status
        - files
        - createdAt
        - completedAt
        - links
    AddLibraryCollectionSourcesResponse:
      type: object
      properties:
        addedCount:
          type: integer
          description: Sources newly added; sources already in the collection are skipped.
        added:
          type: array
          items:
            type: object
            properties:
              sourceId:
                type: string
                format: uuid
              collectionSourceId:
                type: string
                format: uuid
                description: >-
                  Id of the paper inside the collection. A group collection
                  keeps its own copy, so this differs from sourceId; a personal
                  collection holds the source itself.
            required:
              - sourceId
              - collectionSourceId
          description: The sources this call added.
        duplicates:
          type: array
          items:
            type: object
            properties:
              sourceId:
                type: string
                format: uuid
              duplicateOf:
                type: string
                format: uuid
                description: >-
                  The id of the source that is already in the collection; the
                  source itself when it was already a member.
            required:
              - sourceId
              - duplicateOf
          description: >-
            Sources that were not added because the collection already has the
            same paper. Papers match by Elicit id, DOI, title, or identical PDF.
      required:
        - addedCount
        - added
        - duplicates
    RemoveLibraryCollectionSourcesResponse:
      type: object
      properties:
        removedCount:
          type: integer
          description: >-
            Sources removed; ids not in the collection are skipped. A member's
            own source stays in their library. A shared collection's own paper
            moves to the collection's trash for 30 days.
      required:
        - removedCount
    ListProjectsResponse:
      type: object
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/Project'
          description: >-
            Projects you own and projects shared with you, most recently updated
            first.
        nextCursor:
          type:
            - string
            - 'null'
          description: Pass as `?cursor=` to fetch the next page; null on the last page.
        totalCount:
          type: integer
          description: Total projects you can see, across all pages.
      required:
        - projects
        - nextCursor
        - totalCount
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The project ID (UUID) from `GET /projects`
          example: 9c1f6a7e-5d24-4a3b-9f0e-1b2c3d4e5f60
        name:
          type: string
          description: Project name.
          example: GLP-1 safety review
        goal:
          type: string
          description: The project's stated goal; empty string when none was set.
        role:
          type: string
          enum:
            - owner
            - writer
            - reader
          description: >-
            Your access level on this project. `owner`: you created it, and you
            alone can share it. `writer`: you can add and remove its contents.
            `reader`: you can view it.
        owner:
          type: object
          properties:
            email:
              type: string
              example: owner@example.com
            fullName:
              type:
                - string
                - 'null'
          required:
            - email
            - fullName
          description: Who owns the project. On your own projects, that is you.
        createdAt:
          type: string
        updatedAt:
          type: string
          description: >-
            Last change to the project or its contents. Lists are ordered by
            this, newest first.
        url:
          type: string
          description: URL to open this project in the Elicit web interface.
        links:
          type: object
          properties:
            self:
              type: string
              description: API URL of this project.
            shares:
              type: string
              description: API URL of this project's shares.
          required:
            - self
            - shares
      required:
        - id
        - name
        - goal
        - role
        - owner
        - createdAt
        - updatedAt
        - url
        - links
    CreateProjectShareResponse:
      type: object
      properties:
        projectId:
          type: string
          format: uuid
          description: The project ID (UUID) from `GET /projects`
          example: 9c1f6a7e-5d24-4a3b-9f0e-1b2c3d4e5f60
        share:
          $ref: '#/components/schemas/ProjectShare'
        url:
          type: string
          description: URL to open this project in the Elicit web interface.
      required:
        - projectId
        - share
        - url
    ProjectShare:
      type: object
      properties:
        email:
          type: string
          description: Email address the project is shared with.
          example: colleague@example.com
        status:
          type: string
          enum:
            - registered
            - invited
          description: >-
            "registered" when the recipient already has an Elicit account and
            can read the project now; "invited" when a pending invitation was
            created for an email without an account.
        role:
          type: string
          enum:
            - reader
            - writer
          description: >-
            The recipient's effective access level ÔÇö the strongest of their own
            share and any organization-wide share that currently reaches them.
            This endpoint creates `reader` shares; `writer` means edit access
            was granted in the Elicit web interface.
      required:
        - email
        - status
        - role
    ListProjectSharesResponse:
      type: object
      properties:
        projectId:
          type: string
          format: uuid
          description: The project ID (UUID) from `GET /projects`
          example: 9c1f6a7e-5d24-4a3b-9f0e-1b2c3d4e5f60
        shares:
          type: array
          items:
            $ref: '#/components/schemas/ProjectShare'
          description: >-
            Everyone the project is shared with individually ÔÇö both registered
            recipients and pending email invitations. Members of an
            organization-wide share are not listed here unless they also hold an
            individual share; that access is reported in `organization` instead.
        organization:
          type:
            - object
            - 'null'
          properties:
            name:
              type: string
              example: Acme Research
            memberCount:
              type: integer
              description: Active members of the organization the project is shared with.
            role:
              type: string
              enum:
                - reader
                - writer
              description: The access level every member of that organization has.
          required:
            - name
            - memberCount
            - role
          description: >-
            The organization every one of whose active members can currently
            reach this project, or null if none can. Set in the Elicit web
            interface. An organization-wide share only grants access while that
            organization's plan includes sharing, so a share whose plan has
            lapsed reports null here ÔÇö matching what the access checks actually
            allow.
        url:
          type: string
          description: URL to open this project in the Elicit web interface.
      required:
        - projectId
        - shares
        - organization
        - url
