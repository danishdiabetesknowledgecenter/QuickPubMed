    PublicAgentArtifact:
      type: object
      properties:
        artifactId:
          type: string
          description: >-
            Opaque identifier for the artifact, stable within a session. Pass it
            to the download endpoint to retrieve the file. Never a raw storage
            key.
        kind:
          type: string
          enum:
            - agent-saved-file
            - agent-delivered-file
            - prose-export
            - presentation-export
            - figure-export
            - report-asset
            - report-citation
          description: >-
            The kind of artifact produced in the session. A delivered file lists
            once as "agent-delivered-file"; "agent-saved-file" denotes a file
            the agent saved to its workspace but did not deliver.
        format:
          type:
            - string
            - 'null'
          description: >-
            Subtype within the artifact (e.g. "pdf", "docx", "pptx"). For agent
            files it is the filename extension; null only when the filename has
            no extension.
        filename:
          type: string
          description: Suggested filename for the downloaded artifact.
        contentType:
          type:
            - string
            - 'null'
          description: MIME type of the artifact, when known.
        sizeBytes:
          type:
            - number
            - 'null'
          description: Size of the artifact in bytes, when known.
        createdAt:
          type:
            - string
            - 'null'
          description: ISO 8601 timestamp of when the artifact was produced, when known.
          example: '2025-06-15T14:30:00.000Z'
      required:
        - artifactId
        - kind
        - format
        - filename
        - contentType
        - sizeBytes
        - createdAt
    DeliveredOutputEventSnapshot:
      type: object
      properties:
        artifactId:
          type: string
          description: >-
            Opaque identifier for the interactive artifact, stable within a
            session. Pass it to the artifact content endpoint to retrieve its
            contents. Never a raw storage key or entity hash.
        kind:
          type: string
          enum:
            - table
            - prose
            - presentation
            - figure
          description: >-
            The kind of interactive artifact: table, prose, presentation, or
            figure.
        title:
          type: string
          description: Human-readable title of the artifact.
        caption:
          type:
            - string
            - 'null'
          description: Optional caption describing the artifact.
        rowCount:
          type:
            - integer
            - 'null'
          description: Number of rows for a table artifact; null for non-table kinds.
        createdAt:
          type:
            - string
            - 'null'
          description: ISO 8601 timestamp of when the artifact was delivered, when known.
          example: '2025-06-15T14:30:00.000Z'
      required:
        - artifactId
        - kind
        - title
        - caption
        - rowCount
        - createdAt
    PostAgentSessionMessageResponse:
      type: object
      properties:
        sessionId:
          type: string
          description: Unique identifier for the research agent session.
        status:
          type: string
          const: processing
          description: The session is processing the inserted message.
        messageId:
          type: string
          description: >-
            Identifier of the inserted message. Correlate it with the messageId
            on the matching user_message event.
        url:
          type: string
          description: >-
            URL to view the session in the Elicit web interface. Only the owner
            can continue it.
      required:
        - sessionId
        - status
        - messageId
        - url
    CreateFileResponse:
      type: object
      properties:
        file_id:
          type: string
          description: >-
            Opaque identifier for the staged upload. After uploading the bytes,
            pass it in `attachments` on a Research Agent create/message request,
            or in `fileIds` on a library import. It can be claimed by one
            session or import.
          example: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
        upload_url:
          type: string
          description: >-
            Short-lived presigned S3 PUT URL. Upload the file bytes directly to
            it with the same Content-Type and Content-Length declared here.
        expires_at:
          type: string
          description: >-
            ISO 8601 expiry for the upload URL and unclaimed file_id (30 minutes
            after staging). A file already attached to a session remains usable
            in later turns of that same session.
          example: '2026-07-23T15:00:00.000Z'
      required:
        - file_id
        - upload_url
        - expires_at
    GetAgentSessionArtifactsResponse:
      type: object
      properties:
        sessionId:
          type: string
          description: Unique identifier for the research agent session.
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/PublicAgentArtifact'
          description: >-
            File-backed artifacts produced in the session. Only the latest
            version of each artifact is listed. Retrieve contents via the
            download endpoint.
        deliveredOutputs:
          type: array
          items:
            $ref: '#/components/schemas/PublicDeliveredOutput'
          description: >-
            Interactive outputs (tables, prose, presentations, figures)
            delivered as session outputs. Only the latest delivery of each is
            listed. Retrieve contents via the artifact content endpoint.
        url:
          type: string
          description: >-
            URL to view the session in the Elicit web interface. Only the owner
            can continue it.
      required:
        - sessionId
        - artifacts
        - deliveredOutputs
        - url
    PublicDeliveredOutput:
      type: object
