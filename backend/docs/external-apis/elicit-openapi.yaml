    PublicAgentSessionSource:
      type: object
      properties:
        sourceRef:
          type: string
          description: >-
            Opaque identifier for the underlying source, stable everywhere it
            appears in a session (message citations, table cells, and the
            cited-sources endpoint). Use it to deduplicate citations and to join
            a citation to its entry from the session's cited-sources endpoint,
            which additionally carries the abstract. Never a raw internal id; do
            not construct or decode it.
        title:
          type:
            - string
            - 'null'
          description: Title of the cited work.
        authors:
          type: array
          items:
            type: string
          description: Authors of the cited work, in display order.
        year:
          type:
            - integer
            - 'null'
          description: Publication year.
        doi:
          type:
            - string
            - 'null'
          description: Digital Object Identifier (DOI), when available.
        url:
          type:
            - string
            - 'null'
          description: Best available URL for the cited work.
        venue:
          type:
            - string
            - 'null'
          description: Journal, conference, repository, or other publication venue.
        citationCount:
          type:
            - integer
            - 'null'
          description: Number of works citing this source, when known.
        fullTextAvailable:
          type:
            - boolean
            - 'null'
          description: >-
            Whether the source's full text (rather than the abstract alone) is
            available. Null when the session recorded no verdict ÔÇö most often on
            the events feed, which reports only what the session itself
            recorded. The cited-sources endpoint resolves those unknowns and is
            the reliable place to read this field.
        studyTypeTags:
          type: array
          items:
            type: string
          description: >-
            Study-design tags for the source, when classified (e.g. "Randomized
            Controlled Trial", "Meta-Analysis").
        journalQuartile:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 4
          description: Journal ranking quartile from 1 (highest) to 4, when known.
        elicitId:
          type:
            - string
            - 'null'
          description: Elicit's identifier for the source, when it is in the Elicit corpus.
        abstract:
          type:
            - string
            - 'null'
          description: >-
            The source's own summary ÔÇö the abstract for a paper, or the
            adapter-provided summary for a web or press-release source. Null
            when unavailable, and also for publishers whose abstracts Elicit
            cannot redistribute (the same copyright exclusion applied by the
            paper search endpoint).
      required:
        - sourceRef
        - title
        - authors
        - year
        - doi
        - url
        - venue
        - citationCount
        - fullTextAvailable
        - studyTypeTags
        - journalQuartile
        - elicitId
        - abstract
