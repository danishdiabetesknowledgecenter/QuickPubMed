        - sessionId
        - status
        - title
        - url
        - source
        - createdAt
        - isPublic
        - links
    ResumeSessionResponse:
      type: object
      properties:
        type:
          type: string
          enum:
            - report
            - systematicReview
            - agent
          description: Which kind of session was resumed
        sessionId:
          type: string
          format: uuid
          description: >-
            The session ID (UUID) returned by the create endpoints and `GET
            /sessions`
          example: 5ad08bfb-cbe0-4911-a8c3-309760d33029
        status:
          type: string
          enum:
            - processing
            - pausedForInsufficientQuota
            - completed
            - failed
            - unknown
          description: >-
            Status after the resume ÔÇö normally processing; completed or failed
