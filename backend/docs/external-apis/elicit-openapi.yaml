  /routines:
    get:
      tags:
        - Routines
      security:
        - BearerAuth: []
      summary: List routines
      description: >-
        Returns routines in Research Agent sessions you can access. Without
        `sessionId`, the list includes routines reached through session
        ownership, a direct share, or a project grant; public-link access alone
        is excluded. With `sessionId`, the same filters, ordering, cursor, and
        response shape apply, and an unknown or inaccessible session returns
        404.


        By default the endpoint returns every unarchived routine. Use `filter`
        for active, paused, or archived routines; `q` searches names and
        instructions. The default order is newest first by `createdAt`. Sorting
        by `removedAt` requires `filter=archived`.
      parameters:
        - in: query
          name: sessionId
          description: Restrict results to one accessible Research Agent session.
          schema:
            type: string
            format: uuid
            description: Restrict results to one accessible Research Agent session.
        - in: query
          name: filter
          description: >-
            Restrict results by lifecycle state. Omit to return all unarchived
            routines.
          schema:
            type: string
            enum:
              - active
              - paused
              - archived
            description: >-
              Restrict results by lifecycle state. Omit to return all unarchived
              routines.
        - in: query
          name: q
          description: Case-insensitive search over routine names and instructions.
          schema:
            type: string
            maxLength: 200
            description: Case-insensitive search over routine names and instructions.
        - in: query
          name: limit
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
            description: Page size.
        - in: query
          name: cursor
          description: Opaque nextCursor from the previous page.
          schema:
            type: string
            description: Opaque nextCursor from the previous page.
        - in: query
          name: sortBy
          description: Sort field. removedAt requires filter=archived.
          schema:
            type: string
            enum:
              - createdAt
              - removedAt
            default: createdAt
            description: Sort field. removedAt requires filter=archived.
        - in: query
          name: sortDirection
          schema:
            type: string
            enum:
