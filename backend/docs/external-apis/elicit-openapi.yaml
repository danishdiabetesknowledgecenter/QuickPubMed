      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        instruction:
          type: string
          minLength: 1
          maxLength: 10000
          description: >-
            Instruction sent to the attached Research Agent session on every
            run.
        sessionId:
          type: string
          format: uuid
          description: Existing Research Agent session to attach.
        schedule:
          type: object
          properties:
            cadence:
              type: string
              enum:
                - daily
                - weekly
            dayOfWeek:
              type:
                - integer
                - 'null'
              minimum: 0
              maximum: 6
            runAtLocalTime:
              type: string
              pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
            timeZone:
              type: string
          required:
            - cadence
            - dayOfWeek
            - runAtLocalTime
            - timeZone
        ownerNotificationLevel:
          type: string
          enum:
            - all_runs
            - output_or_attention
            - attention_only
