  /library/imports:
    post:
      tags:
        - Library
      security:
        - BearerAuth: []
      summary: Import uploaded PDFs
      description: >-
        Imports uploaded PDFs into your library. Elicit parses each file,
        extracts its metadata, attaches the full text, and checks for
        duplicates.


        1. Stage each file with `POST /api/v2/files` and PUT the bytes to
        `upload_url`.

        2. Send the `file_id`s here. The response is `202` and an import with
        every file `pending`. `collectionId` adds each imported paper to a
        collection, duplicates included.

        3. Poll `links.self` until `status` is `completed`.


        Each file ends as `created` (`sourceId`), `duplicate` (`duplicateOf`),
        or `failed` (`error`). A file id can be imported once. Files must be
        PDFs. A byte-identical copy of a PDF in your library is always a
        `duplicate`. Do not submit overlapping import requests with the same
        file ids; once claimed, a file cannot be used by another import or
        session.


        ### Example


        ```bash

        curl -X POST https://elicit.com/api/v2/library/imports \
          -H "Authorization: Bearer elk_live_your_key_here" \
          -H "Content-Type: application/json" \
          -d '{"fileIds":["5515a6d4-1b17-4f0d-8484-ccc783b912bc"],"collectionId":"b458052a-84e2-4e47-b5c4-00e11390a265"}'
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fileIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  minItems: 1
                  maxItems: 100
                  description: >-
                    Ids of staged files whose bytes have been uploaded. PDFs
                    only; each file imports once.
                collectionId:
                  type: string
                  format: uuid
                  description: >-
                    A collection you own or can edit to add the imported sources
                    to, duplicates included.
                onDuplicate:
                  type: string
                  enum:
                    - skip
                    - create
                  description: >-
                    skip (default): a PDF matching an already-saved source is
                    reported as its duplicate and not saved. create: saves it as
                    a new source anyway.
              required:
                - fileIds
              additionalProperties: false
      responses:
        '202':
          description: Import accepted; every file is pending. Poll `links.self`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryImport'
              example:
                id: d1e66555-8d92-4701-b46f-7c64a7ab1d4f
                status: processing
                files:
                  - fileId: 5515a6d4-1b17-4f0d-8484-ccc783b912bc
                    filename: lincoff-2023.pdf
                    status: pending
                    sourceId: null
                    duplicateOf: null
                    error: null
                createdAt: '2026-09-01T22:07:28.814Z'
                completedAt: null
                links:
                  self: https://elicit.com/api/v2/library/imports/d1e66555-8d92-4701-b46f-7c64a7ab1d4f
        '400':
          description: >-
            A file is not a PDF, a file has not been uploaded, or the body is
            invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notPdf:
                  summary: Not a PDF
                  value:
                    error:
                      code: unsupported_file_type
                      message: >-
                        Only PDFs can be imported:
                        5515a6d4-1b17-4f0d-8484-ccc783b912bc.
                notUploaded:
                  summary: Staged but the bytes were never PUT
                  value:
                    error:
                      code: file_not_uploaded
                      message: File has not been uploaded yet.
        '401':
          description: >-
            Authentication failed. The API key is missing, invalid, revoked, or
            expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid:
                  summary: Invalid, revoked, or expired key
                  value:
                    error:
                      code: invalid_api_key
                      message: Invalid API key
                missing:
                  summary: No Authorization header
                  value:
                    error:
                      code: missing_authorization
                      message: Authorization header is required
        '403':
          description: >-
            API access is unavailable on your plan, or your role does not allow
            this action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  value:
                    error:
                      code: forbidden
                      message: >-
                        You need edit access to change this collection's
                        sources.
                apiAccess:
                  value:
                    error:
                      code: api_access_denied
                      message: >-
                        API access is not available on your current plan. Please
                        upgrade to Pro or above.
        '404':
          description: >-
            A file_id is unknown or belongs to another user, or the collection
            is not visible to you.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: attachment_not_found
                  message: File 5515a6d4-1b17-4f0d-8484-ccc783b912bc was not found.
        '409':
          description: A file_id was already imported or attached to a session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: attachment_already_used
                  message: >-
                    File 5515a6d4-1b17-4f0d-8484-ccc783b912bc has already been
                    used.
        '410':
