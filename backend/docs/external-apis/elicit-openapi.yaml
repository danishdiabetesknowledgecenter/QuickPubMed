  /sessions/{sessionId}/shares:
    post:
      tags:
        - Sessions
      summary: Share a session
      description: >-
        Grant read-only access to a session by email. Works for every session
        type ÔÇö reports, systematic reviews, and Research Agent sessions. New
        recipients can view the session; this grant does not let them modify,
        resume, stop, or re-share it.


        Existing editor or reviewer permissions on reports and systematic
        reviews are preserved, not downgraded. The returned `share.role:
        "reader"` describes this API's read-only grant, not the recipient's full
        effective permissions. Inspect or change higher-permission roles in the
        web interface; they are not returned by the list-shares endpoint.
        **Revoking the email with DELETE still removes its direct share,
        including an existing editor or reviewer grant.**


        If the email belongs to an existing Elicit account the share takes
        effect immediately (`status: "registered"`). Otherwise a pending
        invitation is created and an email is sent (`status: "invited"`); the
        share activates when they create an account.


        Only the session owner can manage shares. A recipient of a shared
        **agent** session sees it in `GET /api/v2/sessions` with `role:
        "shared"`; a recipient of a shared **report** or **systematic review**
        opens it via the returned web-app `url` ÔÇö it will **not** appear in
        their `GET /api/v2/sessions` list, which stays owner-only for review
        sessions.


        ### Example


        ```bash

        curl -X POST https://elicit.com/api/v2/sessions/{sessionId}/shares \
          -H "Authorization: Bearer elk_live_your_key_here" \
          -H "Content-Type: application/json" \
          -d '{"email":"colleague@example.com"}'
        ```
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: sessionId
          description: >-
            The session ID (UUID) returned by the create endpoints and `GET
            /sessions`
          schema:
            type: string
            format: uuid
            description: >-
              The session ID (UUID) returned by the create endpoints and `GET
              /sessions`
            example: 5ad08bfb-cbe0-4911-a8c3-309760d33029
          required: true
      requestBody:
        required: true
        description: Recipient email
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: >-
                    Email address to share the session with, as a read-only
                    recipient.
                  example: colleague@example.com
              required:
                - email
      responses:
        '201':
          description: The session was shared with the recipient.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSessionShareResponse'
              examples:
                registered:
                  summary: Recipient has an Elicit account
                  value:
                    sessionId: 5ad08bfb-cbe0-4911-a8c3-309760d33029
                    share:
                      email: colleague@example.com
                      status: registered
                      role: reader
                    url: https://elicit.com/review/5ad08bfb-cbe0-4911-a8c3-309760d33029
                invited:
                  summary: Pending invitation for an email without an account
                  value:
                    sessionId: 5ad08bfb-cbe0-4911-a8c3-309760d33029
                    share:
                      email: colleague@example.com
                      status: invited
                      role: reader
                    url: https://elicit.com/review/5ad08bfb-cbe0-4911-a8c3-309760d33029
        '400':
          description: >-
            Invalid request. The email is missing/malformed, or it is the
            caller's own address (you cannot share a session with yourself).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid:
                  summary: Malformed email
                  value:
                    error:
                      code: invalid_request
                      message: Invalid request
                selfShare:
                  summary: Sharing with yourself
                  value:
                    error:
                      code: self_share
                      message: Cannot share a resource with yourself
        '401':
          description: >-
            Authentication failed. The API key is missing, invalid, revoked, or
            expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid:
                  summary: Invalid, revoked, or expired key
                  value:
                    error:
                      code: invalid_api_key
                      message: Invalid API key
                missing:
                  summary: No Authorization header
                  value:
                    error:
                      code: missing_authorization
                      message: Authorization header is required
        '403':
          description: >-
            The share could not be created: the session's recipient cap was
