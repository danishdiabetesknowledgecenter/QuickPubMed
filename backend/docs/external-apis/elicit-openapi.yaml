  /sessions/agents/{sessionId}/skills:
    get:
      tags:
        - Research Agent
      summary: List Research Agent session skills
      description: >-
        List the public Elicit skills and custom skills available to a Research
        Agent session. Each entry includes a skill ID, name, description,
        source, and custom revision ID when applicable. Internal storage
        locations and skill instructions are not exposed.


        This endpoint is owner-only: sharing a session does not grant access to
        the owner's private skill catalog. Custom skills include personal and
        organization-shared skills, subject to the owner's current subscription
        and the agent's 100-skill preload limit. Explicitly attached skills are
        retained with their pinned revisions. Built-in availability and
        custom-skill preloading use the most recently used curator sandbox's
        recorded permissions and bundled selection, including skills withheld by
        structured-agent layers.


        The attached-skill projection is checkpointed and updated incrementally,
        reading at most 1,000 events per stream per request. While a large
        uncached history is indexing, when archived history cannot be restored,
        or before the first curator sandbox specification is recorded, this
        endpoint returns `503 skills_not_ready` with `Retry-After: 1`. Retry the
        same request; indexing resumes from its saved checkpoint and never
        returns a partial catalog.


        This is a discovery catalog, not a list of skills the agent has used or
        a live check of sandbox installation. Catalog changes take effect when
        the agent next synchronizes its skills. Internal-only Elicit skills are
        not listed. The whole list is returned without pagination.


        ### Example


        ```bash

        curl https://elicit.com/api/v2/sessions/agents/{sessionId}/skills \
          -H "Authorization: Bearer elk_live_your_key_here"
        ```
      security:
        - BearerAuth: []
