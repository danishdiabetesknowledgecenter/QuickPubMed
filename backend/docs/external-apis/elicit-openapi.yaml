openapi: 3.1.0
info:
  title: Elicit API
  version: 2.0.0
  description: >-
    The Elicit API lets you search academic papers and clinical trials, run
    research workflows, and manage your library and shared projects.


    ## Getting started


    This reference documents **v2**, with production base URL
    `https://elicit.com/api/v2`. Paths below are relative to that base. The
    older v1 API uses different paths and response envelopes; do not mix v1
    examples with this reference.


    1. Use an Elicit account with API access (Pro or above) and create an API
    key in [account settings](https://elicit.com/settings).

    2. Set `ELICIT_API_KEY` in your environment. Keep it secret; do not embed it
    in browser code or commit it to source control.

    3. Make a search request:


    ```bash

    curl --fail-with-body https://elicit.com/api/v2/search/papers \
      -H "Authorization: Bearer $ELICIT_API_KEY" \
      -H "Content-Type: application/json" \
      -d '{"query":"effects of sleep deprivation on cognitive performance","maxResults":10}'
    ```


    The response contains `papers` and may include non-fatal `warnings`; inspect
    warnings even on a successful response. Search returns results in the same
    request; research workflows return a session to poll instead.


    ### Choose an endpoint


    | Goal | Start here |

    |------|------------|

    | Search papers or clinical trials | `POST /search/papers` or `POST
    /search/trials` |

    | Generate a report from a question | `POST /sessions/reports` |

    | Configure search, screening, extraction, and reporting stages | `POST
    /sessions/systematic-reviews` |

    | Run interactive research with follow-up messages and artifacts | `POST
    /sessions/agents` |

    | Find existing sessions or resume quota-paused work | `GET /sessions`;
    follow `links.self` or `links.resume` |

    | Save papers, import PDFs, or organize collections | `/library/sources`,
    `/library/imports`, and `/library/collections` |

    | Browse or share existing projects | `GET /projects` and `POST
    /projects/{projectId}/shares` |

    | Schedule recurring Research Agent work | `/routines` |

    | Check account usage | `GET /usage` |


    ## Authentication


    All API requests require a Bearer token in the `Authorization` header:


    ```

    Authorization: Bearer elk_live_your_key_here

    ```


    API keys can be created and managed from your [Elicit account
    settings](https://elicit.com/settings).


    ## Billing


    API access requires a Pro plan or above. Your plan limits **results per
    search request**, not requests per day. Exceeding the plan's `maxResults`
    cap returns `400 invalid_request`; see the Search endpoints for the per-plan
    limits.


    All endpoints share a burst limit of **100 requests per minute per IP
    address**, including polling requests. Exceeding it returns `429` and blocks
    that IP for **5 minutes**. Coordinate polling across concurrent sessions and
    clients behind the same IP.


    An exhausted usage allowance returns `402 insufficient_quota` when starting
    work, or pauses a running session with `status:
    "pausedForInsufficientQuota"`. Check `GET /usage`, resolve the limit, then
    POST to `links.resume`; paused work does not automatically resume. Usage
    reporting can return `409` for accounts without usage reporting or while
    their usage data is not ready.


    Manage your plan in [account settings](https://elicit.com/settings).


    ## Code Examples


    Working examples in curl, Python, and JavaScript, plus integrations (CLI
    tool, Slack bot, Claude Code skill):


    **[github.com/elicit/api-examples](https://github.com/elicit/api-examples)**


    ## Error Handling


    Application errors use this JSON envelope. Branch on the HTTP status and
    `error.code`, not the wording of `error.message`:


    ```json

    {"error":{"code":"invalid_request","message":"body.query: Required"}}

    ```


    **Exception: the edge rate limit** returns a flat body, not an `error`
    object:


    ```json

    {"error":"Rate limit exceeded","message":"Too many requests. Please try
    again later."}

    ```


    | HTTP status | What to do |

    |-------------|------------|

    | `400` | Correct the body, query parameters, or path ID; consult the
    endpoint's error codes. |

    | `401` | Supply a valid `Authorization: Bearer ...` header. |

    | `402` | Resolve the account's usage limit before starting or resuming
    work. |

    | `403` | Check plan eligibility and the permissions required for this
    operation. |

    | `404` | Check the ID and access. Inaccessible resources can also return
    404; see endpoint-specific codes for full-text availability. |

    | `409` | Resolve the conflict described by `error.code`; do not retry
    blindly. |

    | `410` | A staged upload expired; stage and upload the file again. |

    | `429` | Stop requests from this IP for the 5-minute block, then reduce the
    request rate. |

    | `5xx` | Retry reads with bounded exponential backoff and jitter. For
    writes, check whether the first request took effect before retrying. |


    Creation and message requests are not guaranteed to be idempotent. A timeout
    does not prove that work was not started: retrying can create another
    session or submit another turn. Save returned IDs and use the read endpoints
    to check progress. Repeat a write only when the endpoint documents that it
    is safe or you have confirmed it did not take effect.


    ## Pagination and asynchronous work


    Paginated session, source, collection, project, routine, and routine-run
    lists return `nextCursor`; most also return `totalCount`, while routine
    lists do not. Share lists and agent artifact/source lists are not paginated.
    Omit `cursor` for the first page; pass `nextCursor` unchanged as the next
    request's `cursor`, keeping the same filters and sort. Stop when it is
    `null`. Treat cursors as opaque and URL-encode them. Lists are not frozen
    snapshots of changing data.


    ```bash

    curl --get https://elicit.com/api/v2/sessions \
      -H "Authorization: Bearer $ELICIT_API_KEY" \
      --data-urlencode "limit=10" \
      --data-urlencode "cursor=$NEXT_CURSOR"
    ```


    Creating a research session returns `202 Accepted`: work has been accepted,
    not finished. Store the `sessionId`. For reports and systematic reviews,
    follow `links.self` for API status; `url` opens the web interface. Poll
    reports and systematic reviews every 30ÔÇô60 seconds. Stop normal polling on
    `completed`, `failed`, or `unknown`; handle `pausedForInsufficientQuota`
    separately as described above. Export downloads may lag behind the research:
    neither `completed` nor `exportsStatus: "ready"` guarantees a current export
    set. If expected URLs are missing, wait at least 60 seconds and fetch the
    detail endpoint again; use bounded retries with backoff rather than treating
    the omissions as final.


    Research Agent sessions are interactive: `completed` means the agent is idle
    and can receive another message, not permanently closed. Use their events
    endpoint every 3ÔÇô10 seconds while processing. Its `cursor` is an incremental
    activity checkpoint, **not** a list's `nextCursor`.


    ## MCP Server


    Elicit also offers an [MCP](https://modelcontextprotocol.io/) (Model Context
    Protocol) server for Claude Desktop, Claude Code, and other MCP-compatible
    clients. Authentication is via OAuth 2.0, rather than the REST API key shown
    above.


    MCP exposes search, reports, systematic reviews, the Research Agent session
    lifecycle, routines, file-upload staging, artifact reads/downloads, session
    sharing, session listing/resumption, usage, and library tools. It is **not a
    one-to-one mirror of this REST reference**: dedicated cited-source retrieval
    and project management remain REST capabilities without corresponding public
    MCP tools. Use your client's `tools/list` result as the authoritative MCP
    tool inventory. Tools for routines are shown only for accounts that can use
    them.


    ### Claude Code


    ```

    claude mcp add --transport http elicit https://elicit.com/api/mcp

    ```


    Then run `/mcp`, select the `elicit` server, and choose **Authenticate** to
    open a browser for login.


    ### Claude Desktop


    **Via the UI:** Click the icon next to your name > **Settings** >
    **Connectors** > **Add custom connector**. Enter `Elicit` for the name and
    `https://elicit.com/api/mcp` for the URL.


    ### Research Agent workflow over MCP


    Use an account with public API access (Pro or above), authenticated as the
    person who owns the session or has been explicitly granted read access. The
    same plan, quota, and session-access rules as REST apply. No API key or
    switch to REST is needed after the MCP OAuth connection is established. The
    new agent-specific tools are public-only. Elicit's private agentic MCP
    retains read-only session listing but cannot create, message, stop, or
    resume Research Agent sessions, including through the generic resume tool.


    | Tool | Arguments | Result / next step |

    | --- | --- | --- |

    | `create_agent_session` | `query` (1ÔÇô2000 characters), optional
    `attachments: [{file_id}]` | Save `sessionId` and `url`; initial status is
    `processing`. |

    | `list_sessions` | Optional `type: "agent"`, `status`, `source`, `limit`,
    `cursor` | Find owned or explicitly shared sessions. `role: "shared"` means
    read-only. Use `nextCursor` for the next list page. |

    | `get_agent_session` | `sessionId` | Inspect status and the link to open in
    Elicit. |

    | `get_agent_session_events` | `sessionId`, optional `cursor` | Read
    conversation, progress, answers, citations, and Methods incrementally. |

    | `send_agent_session_message` | `sessionId`, `message` (1ÔÇô2000 characters),
    optional `attachments: [{file_id}]` | Returns a `messageId` matching the
    resulting `user_message` event. Owner only. |

    | `stop_agent_session` | `sessionId` | Safely repeat if needed. `stopping`
    acknowledges a queued request; wait for `session_stopped`. Owner only;
    allowed even with exhausted quota. |

    | `resume_session` | `sessionId` | Resume quota-paused work once eligible;
    check `get_usage` if quota is still insufficient. Owner only. |


    **Example in Claude Code or Claude Desktop:** ask ÔÇ£Start a Research Agent
    session on exercise and cardiovascular outcomes. Save its ID and URL, follow
    its progress, and show me the answer with citations and Methods.ÔÇØ After it
    is idle, ask ÔÇ£In that same session, compare the randomized trials.ÔÇØ To
    interrupt the new turn, ask ÔÇ£Stop that session and confirm it has stopped.ÔÇØ
    To find older work, ask ÔÇ£List my Research Agent sessionsÔÇØ; to resume
    eligible work, ask ÔÇ£Resume my quota-paused Research Agent session.ÔÇØ Refresh
    the client's tool list if it cached an older connection.


    **Status:** `processing` means working; `completed` means idle and ready for
    input, not permanently closed; `failed` cannot accept another message;
    `pausedForInsufficientQuota` requires quota and `resume_session` before
    another message. A stopped turn is identified by the `session_stopped` event
    (or `stopped` from the stop tool), not a distinct status in
    list/detail/events responses. It can accept a new message. Prefer sending
    follow-ups after `session_idle` / `completed`. The API may also accept a
    message while an agentic turn is running; a legacy running session can
    return `session_processing`.


    **Incremental polling and reconnects:** omit the events cursor only on the
    first read. Consume the entire returned page, then save its opaque `cursor`
    alongside the session ID and pass it unchanged on the next call. Poll with a
    delay (for example, five seconds); an empty page is not completion. If
    interrupted, reconnect and retry from the last consumed checkpoint.
    Deduplicate replayed events by `eventId`; later snapshots with the same
    `messageId` replace earlier snapshots for display. Do not confuse the events
    cursor with the list cursor, decode it, or reuse it for another session. The
    unchanged REST event representation preserves citation references and source
    metadata, as well as `methods` events. The endpoint uses ordinary JSON tool
    responses, not SSE or background notifications; the assistant may need a
    prompt to continue polling after it ends a conversational turn.


    **Access and errors:** shared users can list and read but cannot send
    messages, stop, or resume; a public URL alone does not grant API read
    access. Tool failures return `isError: true` with an actionable message and
    code: `invalid_arguments` (correct the fields), `api_access_denied` (upgrade
    the account), `session_not_found` (check the ID and explicit share),
    `insufficient_quota` (replenish quota), `session_paused` (resume first),
    `session_failed` (start a new session), or `session_not_paused` (inspect
    current status). For `invalid_cursor`, `cursor_session_mismatch`, or
    `cursor_out_of_range`, check the saved session/checkpoint; if it cannot be
    recovered, omit the cursor and rebuild from full history. Authentication
    failures require reconnecting or authenticating again.


    **Client timeouts:** creation and control operations can take tens of
    seconds; clients should allow at least 60 seconds per tool call. A client
    timeout is not proof a mutation failed. Creation and messages are not
    idempotent: inspect `list_sessions` or session events before retrying to
    avoid duplicate work. If initialization may have committed, a creation error
    includes a typed `sessionId` recovery field: REST returns `{error: {code,
    message, sessionId}}`; MCP returns `isError: true` with the JSON object
    `{code, message, sessionId}` in `content[0].text` (no success
    `structuredContent`). Parse the JSON field, not the prose. Inspect that
    session rather than starting a replacement; its attachment claims remain
    bound to it. A late initialization failure is reconciled: if no initial
    event committed, the session and claims are rolled back and subsequent reads
    return `session_not_found`, after which creation can be retried. Persisted
    or uncertain outcomes remain preserved. Stops may be retried safely.
    MCP-created sessions record `source: "mcp"`, and lifecycle analytics retain
    MCP attribution.


    ### Files, artifacts, and sharing over MCP


    These resource tools are public-only and reuse REST permissions and limits.
    Existing private MCP library tools, including `stage_library_upload`, are
    unchanged; the new tools do not let the internal agent read or manage other
    Research Agent sessions. Upload, artifact, and share analytics record the
    MCP surface.


    | Tool | Arguments | Result / next step |

    | --- | --- | --- |

    | `stage_file_upload` | `filename`, `content_type`, `size_bytes` | Returns
    `file_id`, `upload_url`, `expires_at`. Transfer bytes before attaching the
    file. |

    | `get_agent_session_artifacts` | `sessionId` | Lists latest file-backed
    `artifacts` and interactive `deliveredOutputs`, using the delivery envelope
    below. |

    | `get_agent_session_artifact_content` | `sessionId`, `artifactId` |
    Structured content of a delivered output, including citations, using the
    delivery envelope below. |

    | `download_agent_session_artifact` | `sessionId`, `artifactId`, optional
    `format` | `original` (default) for file-backed artifacts; `json` for any
    delivered output; `csv`/`xlsx` for tables; `md` for prose. Returns
    `downloadUrl`, `expiresAt`, `filename`, `contentType`. |

    | `create_session_share` | `sessionId`, `email` | Owner-only read-only grant
    or invitation for an agent session, report, or systematic review. May send
    email; approve the recipient first. Existing higher permissions are
    preserved. |

    | `list_session_shares` | `sessionId` | Owner-only list of read-only
    recipients and invitations; editors/reviewers are omitted. |

    | `delete_session_share` | `sessionId`, `email` | Owner-only, idempotent
    revocation of any direct role or invitation, including editor/reviewer
    access omitted from the list. Other access paths are unaffected. |


    **Complete example with Claude Code:** connect and authenticate as above,
    then ask: ÔÇ£Use the local file trial-results.pdf as evidence for a Research
    Agent comparison of these trials. Stage and upload the file, start research
    with its file_id, save the session ID and URL, and follow progress using the
    returned cursor. Show the answer with citations and Methods. Once idle,
    attach follow-up.pdf in a follow-up asking for a comparison table and a
    prose summary. Retrieve the structured table and download CSV, XLSX, and
    Markdown exports to local files. Ask me before sharing the session with
    colleague@example.com, then list the shares. Start a further analysis, stop
    it while it is working, and confirm session_stopped.ÔÇØ


    The concrete sequence is:


    1. Compute the exact local file size; call `stage_file_upload({filename:
    "trial-results.pdf", content_type: "application/pdf", size_bytes:
    <bytes>})`.

    2. PUT the bytes to the returned URL. For a shell-capable client, use the
    command below; it must succeed before continuing. Never send the Elicit
    OAuth bearer token to this URL.

    3. Call `create_agent_session({query: "Compare these trials", attachments:
    [{file_id: "<returned UUID>"}]})`. Poll
    `get_agent_session_events({sessionId, cursor})` as above. Staging alone does
    not attach anything.

    4. After idle, stage/upload the second file and call
    `send_agent_session_message({sessionId, message: "Compare these studies in a
    table and prose summary", attachments: [{file_id: "<second UUID>"}]})`.
    Follow events using the saved cursor.

    5. Call `get_agent_session_artifacts({sessionId})`. For a delivered table,
    call `get_agent_session_artifact_content({sessionId, artifactId})` and
    `download_agent_session_artifact({sessionId, artifactId, format: "csv"})`
    (or `xlsx`). For prose use `md`; for all delivered kinds use `json`. For a
    file-backed artifact omit the format. Always use the opaque IDs returned by
    the list, never a filename, URL, bucket, or key.

    6. Fetch the returned download URL into a local file, without an
    Authorization header. For large JSON, inspect selected rows/fields outside
    model context instead of pasting the full file into chat. A successful tool
    call returns a link, not proof the client downloaded it.

    7. With approval, call `create_session_share({sessionId, email:
    "colleague@example.com"})`, then `list_session_shares({sessionId})`. The
    authenticated recipient can read artifacts but cannot send, stop, resume, or
    manage shares. To revoke, call `delete_session_share` with the same
    arguments.

    8. Call `stop_agent_session({sessionId})` during ongoing work and poll for
    `session_stopped`; repeating stop is safe.


    ```bash

    # Use upload_url from stage_file_upload, not the MCP endpoint:

    curl --fail --request PUT --upload-file trial-results.pdf \
      --header 'Content-Type: application/pdf' "$UPLOAD_URL"
    # Use downloadUrl returned by a download tool (or the delivery envelope):

    curl --fail --location "$DOWNLOAD_URL" --output research-output.csv

    ```


    **Large results:** artifact listing and content tools return `{delivery:
    "inline", data: ...}` for small results. When the formatted JSON exceeds 24
    KiB, they instead return `{delivery: "download", download: {downloadUrl,
    expiresAt, filename, contentType}, sizeBytes}`, linking to the complete JSON
    with no truncation. This avoids placing large tables/prose in MCP responses,
    including the duplicate text/structured representation. JSON exports are
    serialized incrementally with a streaming JSON dependency through a
    temporary file, yielding between chunks rather than building a second full
    in-memory copy of the response. Generated exports are limited to 64 MiB and
    return `artifact_too_large` rather than partial content. Each process allows
    at most four active JSON spools (256 MiB aggregate); excess requests return
    retryable `export_busy` instead of queueing unbounded work. Upload/signing
    has a 60-second deadline (`export_timeout` is retryable); unsuccessful
    exports are removed best-effort, and S3 bucket lifecycle expires current
    objects under `mcp/agent-artifacts/` after one day and noncurrent versions
    one day after becoming noncurrent, and cleans up expired delete markers.
    Lifecycle expiration is day-based and deletion is asynchronous, so stored
    bytes can remain longer; it is separate from the download URL expiry.
    Temporary local files are removed after success or failure. It does not
    paginate or silently omit rows, slides, citations, or metadata. Download
    links last 30 minutes; call the tool again for a fresh link. The next call
    may reflect newer session output, so retain the downloaded file if you need
    that snapshot.


    **Transfer limits and client capabilities:** the existing 30 MiB per-file
    and 20 distinct files per-session limits apply. Upload eligibility,
    ownership, exact size, expiry, and one-session-or-import claiming rules are
    unchanged. An already-attached file can be reused in the same session.
    Unclaimed files and PUT URLs expire after 30 minutes. Unsupported export
    formats return `invalid_arguments` or `download_not_available`; missing or
    inaccessible sessions/artifacts return `session_not_found` or
    `artifact_not_found`. Upload validation failures are returned as actionable
    tool errors; fix the upload before retrying the create/message.


    Claude Code can use local file and HTTP tools, subject to its permissions. A
    remote MCP connector alone, including a chat-only Claude Desktop setup, does
    not give the server access to a local file or guarantee that the client can
    perform PUT/GET transfers. Such clients need a separate file-transfer
    capability or a user-performed transfer; do not claim end-to-end
    upload/download support without testing it in that client. Download URLs are
    temporary bearer capabilities: keep them private and use session sharing for
    durable access. Revoking a share prevents future authorized reads but cannot
    invalidate already-issued download URLs before expiry.


    ### Other MCP clients


    Connect any MCP client using HTTP transport to `https://elicit.com/api/mcp`.
    OAuth discovery is available at
    `https://elicit.com/api/mcp/.well-known/oauth-protected-resource`.


    For MCP setup guides, tool reference, and usage examples, see
    [github.com/elicit/api-examples/tree/main/integrations/mcp](https://github.com/elicit/api-examples/tree/main/integrations/mcp).
  termsOfService: https://elicit.com/operations/terms
  contact:
    name: Elicit
    url: https://elicit.com
externalDocs:
  description: Code examples and integrations
  url: https://github.com/elicit/api-examples
servers:
  - url: https://elicit.com/api/v2
    description: Elicit
tags:
  - name: Search
    description: One-shot searches over papers and clinical trials.
  - name: Sessions
    description: >-
      Long-running research sessions. Reports, systematic reviews, and Research
      Agent sessions are kinds of sessions; list and resume them uniformly here,
      or use the typed subsections to create them and fetch results.
  - name: Reports
    description: Create reports and fetch their status and results.
  - name: Systematic Reviews
    description: Create systematic reviews and fetch their status and results.
  - name: Usage
    description: >-
      Report plan usage and extra usage ÔÇö the account-settings usage meter, over
      the API.
  - name: Research Agent
    description: >-
      Stateful research sessions with incremental activity, follow-up messages,
      file uploads, and downloadable artifacts. Owners and direct share
      recipients can read session details, events, sources, and artifacts; only
      owners can send messages, stop, resume, or manage shares.
  - name: Routines
    description: >-
      Schedule a recurring instruction against an existing Research Agent
      session, manage its lifecycle, inspect its run history, or request an
      immediate run.


      ### Conventions


      - Routines are available to eligible Pro, Scale, and Enterprise accounts.
      A `403` response indicates whether API access or routines are unavailable.

      - API keys act as their user. Session owners and editors can manage a
      routine; readers can list it, retrieve it, and inspect its runs. Only the
      routine owner can change `ownerNotificationLevel`.

      - An inaccessible routine or session returns `404` so its existence is not
      disclosed.

      - Schedules are daily or weekly in an IANA time zone. Pausing stops future
      scheduled occurrences; resuming restores the schedule. Archiving removes
      the schedule but preserves the routine and its run history. Restoring an
      archived routine leaves it paused, so call resume separately when it
      should run again.

      - Creating, updating, resuming, or immediately running a routine can be
      refused when the attached session owner's plan does not include routines.
      Creation, resume, and immediate runs also require that owner to be able to
      run agent work. Pause, archive, and restore remain available to eligible
      managers.

      - Each executed immediate run consumes an agent turn. Accepted requests
      may be skipped if another run starts before processing; skipped requests
      do not appear in run history. Only one manual request may be queued or
      running at a time; another request returns `409
      routine_run_already_pending`.

      - List cursors are opaque and bound to their filters and sort. Run-history
      cursors are also bound to the routine. Pass `nextCursor` back unchanged
      and stop when it is `null`.
  - name: Library
    description: >-
      Your library: saved papers (sources) and the collections that group them,
      including items shared with you.


      ### Conventions


      - A detail endpoint returns the resource. A list endpoint returns `{
      <items>, nextCursor, totalCount }`. Send `nextCursor` as `cursor` to get
      the next page. `nextCursor` is `null` on the last page.

      - You see your own sources and collections plus any shared with you. Each
      carries your `role`. On a collection, `reader`, `writer`, or `owner`:
      readers view; writers also add and remove sources and edit the name and
      description; owners also delete it and change who it is shared with. On a
      source, `reader` or `writer`: writers edit its metadata, attach a PDF,
      delete it, and add it to collections.

      - A shared collection owns its papers. Adding one of your sources to it
      copies the paper into the collection; your own source is unchanged, and
      you are a `writer` on the copy if you own or can edit the collection and a
      `reader` if you can only view it. Removing a paper from such a collection
      moves it to the collection's trash for 30 days.

      - An id you cannot see returns `404`. An action your role does not allow
      returns `403 forbidden`.

      - Creating a collection returns `201`; synchronous bulk operations return
      `200`; PDF imports return `202` and must be polled. Retry behavior varies
      by endpoint. Creating a collection again creates another collection, and
      saving sources with `onDuplicate: create` can create additional copies.

      - A duplicate is not an error. Saving a paper that is already in your
      library returns the existing source with `created: false` and
      `duplicateOf` set; with `onDuplicate: create`, a copy is saved with
      `created: true` and `duplicateOf` names the original. A PDF import reports
      the file as `duplicate`. Duplicate detection uses Elicit ids, DOIs, and
      strong title similarity. Authors can corroborate a title match, and a
      sufficiently strong title can match without author corroboration;
      conflicting DOI, year, or abstract evidence can rule out a title-based
      match. Items in one request are also matched against each other.

      - Adding sources to a collection validates all source ids before changing
      memberships; an unknown or inaccessible source fails that add request.
      Removing sources skips ids not in the collection. Do not assume every bulk
      operation is atomic: source saves are processed individually and PDF
      imports report per-file outcomes.

      - Deleting a source is a soft delete. A repeat returns `204`. Deleting a
      collection is permanent. Its sources stay in the library. A repeat returns
      `404`.

      - DOIs saved through the API are stored in bare lowercase form
      (`10.1056/nejmoa2307563`). Input and the `doi` filter accept `doi.org`
      URLs, `doi:` prefixes, and any letter case.

      - A malformed id, or an unknown query parameter or body key, returns `400
      invalid_request` with the field name.
  - name: Projects
    description: >-
      Projects: the shared workspaces that group sessions, files, and artifacts,
      including those shared with you.


      ### Conventions


      - A detail endpoint returns the resource. The list endpoint returns `{
      projects, nextCursor, totalCount }`. Send `nextCursor` as `cursor` to get
      the next page. `nextCursor` is `null` on the last page.

      - You see projects you own plus any shared with you, directly or with your
      organization. Each carries your `role`: `owner`, `writer`, or `reader`.
      Readers view a project; writers also add and remove its contents; only the
      owner can share it or change who it is shared with.

      - A project id you cannot see returns `404`, and so does one you can read
      but do not own when you call a share endpoint, so an id can never be
      probed for existence or ownership.

      - Shares are keyed by email, never by user id. A recipient with an Elicit
      account has `status: "registered"`; an email without one gets a pending
      invitation and `status: "invited"`.

      - Roles describe **effective** access, not stored rows. An
      organization-wide share only reaches its members while that organization's
      plan includes sharing, and a member covered by one holds the stronger of
      it and their own share.

      - Sharing through this API grants read-only access. Edit access is granted
      in the Elicit web interface, which applies the organization and plan rules
      it requires; an email that already has it keeps it, and this endpoint
      reports their `role` as `writer` rather than downgrading them.

      - Creating a share returns `201`. Repeating it is safe and changes
      nothing.

      - A malformed id, or an unknown query parameter or body key, returns `400
      invalid_request` with the field name.
paths:
  /search/papers:
    post:
      tags:
        - Search
      summary: Search for academic papers
      description: >-
        Search Elicit's database of over 138 million academic papers using
        natural language queries.


        Semantic search uses natural language understanding to find relevant
        papers even when the exact terms don't match.


        Set `corpus` to `pubmed` to restrict results to PubMed, or leave it as
        the default `elicit` for the full paper index. Set `searchMode` to
        `"keyword"` to use corpus-specific query syntax instead of natural
        language: Lucene-style boolean expressions for `elicit`, and PubMed
        syntax such as `[Title/Abstract]` and `[MeSH]` for `pubmed`.


        Filters and `searchMode: "keyword"` are mutually exclusive ÔÇö put any
        filter expressions directly into the query string when using keyword
        search. Mixing them returns a 400.


        To search clinical trials instead, use [`POST
        /api/v2/search/trials`](#tag/Search/paths/~1search~1trials/post).


        ### Limits


        `maxResults` defaults to 10. Search returns up to that many results in
        one response; it does not provide a pagination cursor. Each plan caps
        how many results a single request may return. A value above your plan's
        cap returns `400 invalid_request` rather than being silently reduced:


        | Plan | Results per request |

        |------|--------------------|

        | Basic | No access |

        | Plus | No access |

        | Pro | 300 |

        | Scale | 500 |

        | Enterprise | 10,000 |


        Search is rate-limited only by the global limit of 100 requests per
        minute per IP address, applied across all endpoints and all plans.
        Exceeding it returns a `429` and blocks the IP for 5 minutes.


        Upgrade your plan in [account settings](https://elicit.com/settings) for
        higher per-request result caps.


        ### Example


        ```bash

        curl -X POST https://elicit.com/api/v2/search/papers \
          -H "Authorization: Bearer elk_live_your_key_here" \
          -H "Content-Type: application/json" \
          -d '{"query": "effects of sleep deprivation on cognitive performance"}'
        ```
      security:
        - BearerAuth: []
      requestBody:
        required: true
        description: Search parameters
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaperSearchRequest'
            examples:
              elicit:
                summary: Elicit paper index (default) with filters
                value:
                  query: GLP-1 receptor agonists for weight loss
                  filters:
                    minEpochS: 1672531200
                    maxEpochS: 1791484009
                    includeKeywords:
                      - semaglutide
                      - liraglutide
                    excludeKeywords:
                      - rodent
                      - mouse model
                    typeTags:
                      - RCT
                      - Meta-Analysis
                    hasPdf: true
                  maxResults: 20
              pubmed:
                summary: PubMed keyword query with field tags
                value:
                  query: '"semaglutide"[Title/Abstract] AND "diabetes"[MeSH]'
                  corpus: pubmed
                  searchMode: keyword
                  maxResults: 20
      responses:
        '200':
          description: Search results returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperSearchResponse'
              example:
                papers:
                  - elicitId: abc123def456
                    title: >-
                      Effects of Sleep Deprivation on Cognitive Performance: A
                      Meta-Analysis
                    authors:
                      - Smith, J.
                      - Jones, A.
                      - Williams, R.
                    year: 2023
                    abstract: >-
                      This meta-analysis examines the relationship between sleep
                      deprivation and various measures of cognitive
                      performance...
                    doi: 10.1234/sleep.2023.001
                    pmid: '37123456'
                    venue: Sleep Medicine Reviews
                    citedByCount: 42
                    urls:
                      - https://example.com/paper.pdf
                    studyTypeTags:
                      - Meta-Analysis
                    journalQuartile: 1
                    fullTextUrl: https://example.com/paper.pdf
                warnings: []
        '400':
          description: >-
            Invalid request. Check `query`, the 1ÔÇô10000 schema range and your
            plan's lower `maxResults` cap, and that keyword search is not
            combined with filters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_request
                  message: query is required
        '401':
          description: >-
            Authentication failed. The API key is missing, invalid, revoked, or
            expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing:
                  summary: Missing Authorization header
                  value:
                    error:
                      code: missing_authorization
                      message: Authorization header is required
                invalid:
                  summary: Invalid API key
                  value:
                    error:
                      code: invalid_api_key
                      message: Invalid API key
                revoked:
                  summary: Revoked API key
                  value:
                    error:
                      code: invalid_api_key
                      message: Invalid API key
        '402':
          description: Insufficient quota.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: insufficient_quota
                  message: Insufficient quota.
        '403':
          description: >-
            API access is not available on your current plan. Upgrade to Pro or
            above to use the API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: api_access_denied
                  message: >-
                    API access is not available on your current plan. Please
                    upgrade to Pro or above.
        '429':
          description: >-
            Rate limit exceeded. More than 100 requests per minute were received
            from your IP address; further requests are blocked for 5 minutes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudflareRateLimitError'
              example:
                error: Rate limit exceeded
                message: Too many requests. Please try again later.
        '500':
          description: An unexpected error occurred. Retry after a short delay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: internal_error
                  message: Internal server error
