  /sessions/agents/{sessionId}/artifacts/{artifactId}/content:
    get:
      tags:
        - Research Agent
      summary: Get interactive artifact contents
      description: >-
        Materialize the contents of an interactive artifact listed under
        `deliveredOutputs` on the list-artifacts endpoint.


        The response is structured JSON discriminated on `kind`: tables carry
        `columns` and `rows`; prose and figures carry supported content (cleaned
        text, the original markdown, and resolved citations); presentations
        carry slides. The default `format` is `json` (omitting the parameter is
        equivalent to `?format=json`). Tables can also be downloaded with
        `?format=csv` or `?format=xlsx`, and prose with `?format=md`. File
        responses are served with `Content-Disposition: attachment`, not as
        JSON. Unsupported kind/format combinations return `400
        download_not_available`.


        ### Example


        ```bash

        # Structured JSON

        curl
        https://elicit.com/api/v2/sessions/agents/{sessionId}/artifacts/{artifactId}/content
        \
          -H "Authorization: Bearer elk_live_your_key_here"

        # Table as CSV

        curl
        "https://elicit.com/api/v2/sessions/agents/{sessionId}/artifacts/{artifactId}/content?format=csv"
        \
          -H "Authorization: Bearer elk_live_your_key_here" \
          -O -J

        # Prose as portable Markdown

        curl
        "https://elicit.com/api/v2/sessions/agents/{sessionId}/artifacts/{artifactId}/content?format=md"
        \
          -H "Authorization: Bearer elk_live_your_key_here" \
          -O -J
        ```
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: sessionId
          schema:
            type: string
            format: uuid
          required: true
        - in: path
          name: artifactId
          schema:
            type: string
            minLength: 1
          required: true
        - in: query
          name: format
          description: >-
            Response format: omit or "json" for the JSON body; "csv"/"xlsx" to
            download a table as a file, or "md" to download prose as Markdown.
          schema:
            type: string
            enum:
              - json
              - csv
              - xlsx
              - md
            description: >-
              Response format: omit or "json" for the JSON body; "csv"/"xlsx" to
              download a table as a file, or "md" to download prose as Markdown.
      responses:
        '200':
          description: >-
            Contents of the interactive artifact: structured JSON, a CSV/XLSX
            file for a table, or a Markdown file for prose.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAgentSessionArtifactContentResponse'
              example:
                artifactId: aW50ZXJhY3RpdmUtdGFibGU6...
                kind: table
                title: Biologics for plaque psoriasis
                caption: Comparison of efficacy outcomes across included trials
                columns:
                  - Study
                  - Intervention
                  - PASI 90 at week 16
                rows:
                  - Study:
                      text: UNCOVER-3
                      citations: []
                      source: null
                    Intervention:
                      text: Ixekizumab 80 mg Q2W
                      citations: []
                      source: null
                    PASI 90 at week 16:
                      text: 68%
                      citations: []
                      source: null
                url: https://elicit.com/agent/a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            text/markdown:
              schema:
                type: string
                format: binary
        '400':
          description: >-
            The requested file format is not available for this artifact kind.
            Tables support CSV/XLSX and prose supports Markdown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: download_not_available
                  message: >-
