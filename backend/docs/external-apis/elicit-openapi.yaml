              the first page. The cursor is the id of the last project on the
              previous page, and the list is ordered by `updatedAt`, so it is
              only stable while the set is: if that project is deleted or
              unshared before you page again the request returns 400, and a
              project updated between pages moves to the front and can be
              missed. Restart from the first page if either matters.
            example: 9c1f6a7e-5d24-4a3b-9f0e-1b2c3d4e5f60
