        percentUsed:
          type: number
          description: Percentage of plan usage consumed this billing period.
        periodStart:
          type: string
          description: ISO 8601 start of the current billing period.
        periodEnd:
          type: string
          description: >-
            ISO 8601 end of the current billing period. Monthly usage limits
            reset at this time.
        extraUsage:
          oneOf:
            - $ref: '#/components/schemas/ExtraUsage'
            - type: 'null'
          description: >-
            Extra-usage amount and limit in USD cents. Null when extra usage is
