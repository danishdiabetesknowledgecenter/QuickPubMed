        owner-only: a shared agent session may include the link, but a
        recipient's resume request returns `404 session_not_found`.


        A paused session stays paused until it is explicitly resumed. Once the
        usage limit is resolved (for example after upgrading or when a new
        billing period starts), call this endpoint ÔÇö or use the resume banner in
        the Elicit web interface ÔÇö to continue the run.


