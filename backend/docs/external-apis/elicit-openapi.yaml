            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: internal_error
                  message: Internal server error
  /sessions/systematic-reviews:
    post:
      tags:
        - Systematic Reviews
      summary: Create a new systematic review
      description: >-
        Start a systematic review. Elicit runs the stages you configure ÔÇö
        searches, abstract screening, fulltext screening, extraction, and a
        report. Each stage runs only when you include it; omit a stage to skip
        it. The default example below runs a complete review end-to-end.


        Systematic reviews are long-running operations. The response includes a
        `sessionId` and a `links.self` URL
        (`/api/v2/sessions/systematic-reviews/:sessionId`) that you poll for
        status. You can also watch progress live at the `url` in the response.


        Two options are chosen by the person requesting the review rather than
        by the client calling this endpoint: the screening `depth` at each stage
        and `extraction.useFigures`, both of which require higher usage when
        enabled. Set them explicitly rather than relying on the defaults ÔÇö the
        examples below do ÔÇö and check the `settings` block in the response to
        confirm what the review is actually running with.


        ### Plan limits


        | Plan | Max columns | Max results per query | Max total results |
        Figure extraction |

        |------|-------------|----------------------|-------------------|-------------------|

        | Pro | 20 | 1,000 | 5,000 | No |

        | Scale | 30 | 5,000 | 20,000 | Yes |

        | Enterprise | 40 | 10,000 | 40,000 | Yes |


        ### Example


        ```bash

        curl -X POST https://elicit.com/api/v2/sessions/systematic-reviews \

        -H "Authorization: Bearer elk_live_your_key_here" \

        -H "Content-Type: application/json" \

        -d '{
          "researchQuestion": "Do GLP-1 receptor agonists reduce MACE in T2D patients?",
          "searches": [{ "query": "GLP-1 cardiovascular outcomes", "maxResults": 200 }],
          "abstractScreening": { "generate": true, "depth": "thorough" },
          "fulltextScreening": { "reuseAbstractCriteria": true, "depth": "thorough" },
          "extraction": { "generate": true, "useFigures": false },
          "generateReport": true
        }'

        ```
      security:
        - BearerAuth: []
      requestBody:
        required: true
        description: Systematic review configuration
        content:
          application/json:
            schema:
              type: object
              properties:
                researchQuestion:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: The research question the review is investigating.
                  example: Do GLP-1 receptor agonists reduce MACE in T2D patients?
                protocolDetails:
                  type: string
                  maxLength: 10000
                  description: >-
                    Free-form context (PICO, methodology, inclusion/exclusion
                    rationale) used when Elicit generates screening criteria,
                    extraction columns, or the final report.
                searches:
                  type: array
                  items:
                    type: object
                    properties:
                      query:
                        type: string
                        minLength: 1
                        maxLength: 2000
                        description: Search query
                        example: GLP-1 receptor agonist cardiovascular outcomes
                      corpus:
                        type: string
                        enum:
                          - elicit
                          - pubmed
                          - clinical_trials
                        description: >-
                          Corpus to search. `elicit` (default) searches Elicit's
                          full academic paper index, spanning most research
                          domains. `pubmed` restricts results to PubMed.
                          `clinical_trials` returns registered trials only.
                        example: elicit
                        default: elicit
                      searchMode:
                        type: string
                        enum:
                          - semantic
                          - keyword
                        default: semantic
                        description: >-
                          `semantic` (default) uses vector-similarity retrieval;
                          `keyword` uses literal keyword matching.
                      maxResults:
                        type: integer
                        minimum: 1
                        maximum: 10000
                        default: 200
                        description: >-
                          Maximum number of papers to retrieve from this search.
                          Plan-specific caps apply.
                        example: 200
                    required:
                      - query
                  maxItems: 20
                  default: []
                  description: >-
                    Searches that feed the review pipeline. If omitted or empty,
                    Elicit runs a semantic search using `researchQuestion` as
                    the query. Total search results are subject to plan-specific
                    limits.
                abstractScreening:
                  type: object
                  properties:
                    criteria:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            minLength: 1
                            maxLength: 200
                            description: Short name for the criterion
                            example: Human study
                          instructions:
                            type: string
                            minLength: 1
                            maxLength: 2000
                            description: >-
                              Plain-language instructions used to judge whether
                              a paper meets this criterion
                            example: >-
                              The study must be conducted in human subjects (not
                              in vitro or animal-only).
                        required:
                          - name
                          - instructions
                      maxItems: 40
                      description: Explicit screening criteria.
                    generate:
                      type: boolean
                      default: false
                      description: >-
                        When true, Elicit generates additional screening
                        criteria.
                    depth:
                      type: string
                      enum:
                        - fast
                        - thorough
                      default: thorough
                      description: >-
                        How thoroughly Elicit judges each abstract against your
                        criteria. `thorough` applies the criteria in full,
                        records the quotes behind each decision, and requires
                        higher usage. `fast` returns decisions without
                        supporting quotes and wrongly excludes more papers that
                        met your criteria. The person you are acting for chooses
                        this ÔÇö do not decide it yourself. If they asked for a
                        thorough screen, set `thorough`; if they asked for a
                        fast one, set `fast`; if they have not said, ask them
                        rather than picking silently. Omitting this field means
                        `thorough`, so state your choice explicitly and tell the
                        person which depth the review will use.
                  description: >-
                    Abstract-stage screening. Supply `criteria`, `generate:
                    true`, or both. Omit the field to skip.
                fulltextScreening:
                  type: object
                  properties:
                    criteria:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            minLength: 1
                            maxLength: 200
                            description: Short name for the criterion
                            example: Human study
                          instructions:
                            type: string
                            minLength: 1
                            maxLength: 2000
                            description: >-
                              Plain-language instructions used to judge whether
                              a paper meets this criterion
                            example: >-
                              The study must be conducted in human subjects (not
                              in vitro or animal-only).
                        required:
                          - name
                          - instructions
                      maxItems: 40
                      description: Explicit fulltext-stage criteria.
                    reuseAbstractCriteria:
                      type: boolean
                      default: false
                      description: >-
                        When true, the abstract-stage criteria are also applied
                        at the fulltext stage.
                    depth:
                      type: string
                      enum:
                        - fast
                        - thorough
                      default: thorough
                      description: >-
                        How thoroughly Elicit judges each full text against your
                        criteria, with the same trade-off as
                        `abstractScreening.depth`: `thorough` applies the
                        criteria in full, records the quotes behind each
                        decision, and requires higher usage; `fast` returns
                        decisions without supporting quotes and wrongly excludes
                        more papers that met your criteria. The person you are
                        acting for chooses this ÔÇö do not decide it yourself, and
                        ask them if they have not said which they want. Omitting
                        this field means `thorough`.
                  description: >-
                    Fulltext-stage screening. Supply `criteria`,
                    `reuseAbstractCriteria: true`, or both. Requires
                    `abstractScreening` to be present. Omit to skip.
                extraction:
                  type: object
                  properties:
                    questions:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            minLength: 1
                            maxLength: 200
                            description: Column header for this extraction question
                            example: MACE hazard ratio
                          instructions:
                            type: string
                            minLength: 1
                            maxLength: 2000
                            description: >-
                              Plain-language instructions describing what to
                              extract
                            example: >-
                              Extract the hazard ratio and 95% confidence
                              interval for 3-point MACE.
                          choices:
                            type: array
                            items:
                              type: string
                              minLength: 1
                              maxLength: 200
                            minItems: 2
                            maxItems: 10
                            description: >-
                              Optional fixed list of allowed answers. Omit for
                              free-text extraction. When set, the model is
                              constrained to one of these values.
                            example:
                              - 'yes'
                              - 'no'
                              - maybe
                        required:
                          - name
                          - instructions
                      maxItems: 40
                      description: Explicit extraction columns.
                    generate:
                      type: boolean
                      default: false
                      description: >-
                        When true, Elicit generates additional extraction
                        columns.
                    useFigures:
                      type: boolean
                      default: false
                      description: >-
                        Whether Elicit also reads figures and charts when
                        answering your extraction questions, so it can pick up
                        results that appear only in a figure ÔÇö dose-response
                        curves, Kaplan-Meier plots, anything whose answer lives
                        in the image. It applies to every extraction column on
                        every included paper, makes extraction slower, and
                        requires higher usage. The person you are acting for
                        chooses this ÔÇö do not turn it on of your own accord. If
                        they asked for figures, set it to `true` without
                        hesitation; if they have not said, ask them. Omitting
                        this field means figures are not read. Requires a plan
                        that includes figure extraction.
                  description: >-
                    Extraction stage. Supply `questions`, `generate`, or both.
                    Omit to skip extraction entirely.
                generateReport:
                  type: boolean
                  default: false
                  description: >-
                    Generate a full report at the end of the review. Requires
                    `extraction`.
                  example: true
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: Optional title for the review.
                isPublic:
                  type: boolean
                  default: false
                  description: >-
                    Whether the review should be publicly accessible via its URL
                    without authentication. Defaults to false.
                  example: false
                dryRun:
                  type: boolean
                  const: false
                  description: Deprecated. Omit this field to create the review.
              required:
                - researchQuestion
            examples:
              full:
                summary: >-
                  Full systematic review ÔÇö search, screening, extraction, and
                  report
                value:
                  researchQuestion: Do GLP-1 receptor agonists reduce MACE in T2D patients?
                  searches:
                    - query: GLP-1 cardiovascular outcomes
                      maxResults: 200
                  abstractScreening:
                    generate: true
                    depth: thorough
                  fulltextScreening:
                    reuseAbstractCriteria: true
                    depth: thorough
                  extraction:
                    generate: true
                    useFigures: false
                  generateReport: true
              fulltextCopy:
                summary: >-
                  Provided abstract criteria, fulltext copying them, provided
                  extraction
                value:
                  researchQuestion: Do GLP-1 receptor agonists reduce MACE in T2D patients?
                  searches:
                    - query: GLP-1 cardiovascular outcomes
                  abstractScreening:
                    criteria:
                      - name: RCT
                        instructions: Randomized controlled trial
                      - name: T2D adults
                        instructions: Population is adults with T2D
                    depth: thorough
                  fulltextScreening:
                    reuseAbstractCriteria: true
                    depth: thorough
                  extraction:
                    questions:
                      - name: 'N'
                        instructions: Total randomized
                      - name: MACE HR
                        instructions: Hazard ratio and 95% CI for 3-point MACE
                    useFigures: true
                  generateReport: true
              additive:
                summary: >-
                  Provided + generated together: layer your criteria, let Elicit
                  add more
                description: >-
                  Screens the 500 candidates at `fast` depth, then applies
                  `thorough` depth to the far smaller set that reaches the
                  fulltext stage.
                value:
                  researchQuestion: Do GLP-1 receptor agonists reduce MACE in T2D patients?
                  searches:
                    - query: GLP-1 cardiovascular outcomes
                      maxResults: 500
                  abstractScreening:
                    criteria:
                      - name: RCT
                        instructions: Randomized controlled trial
                    generate: true
                    depth: fast
                  fulltextScreening:
                    criteria:
                      - name: 3-point MACE defined
                        instructions: Primary endpoint is 3-point MACE
                    reuseAbstractCriteria: true
                    depth: thorough
                  extraction:
                    questions:
                      - name: 'N'
                        instructions: Total randomized
                    generate: true
                    useFigures: false
              searchOnly:
                summary: Search only ÔÇö gather papers, no screening/extraction/report
                description: >-
                  Omitting `abstractScreening`, `fulltextScreening`,
                  `extraction`, and `generateReport` skips those stages. This
                  runs a single semantic search over the research question and
                  stops at the gathered-paper list.
                value:
                  researchQuestion: Do GLP-1 receptor agonists reduce MACE in T2D patients?
      responses:
        '202':
          description: >-
            Systematic review creation accepted. The review is now running
            asynchronously. Poll `links.self` for status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystematicReviewSessionCreated'
              example:
                type: systematicReview
                sessionId: 5ad08bfb-cbe0-4911-a8c3-309760d33029
                status: processing
                url: https://elicit.com/review/5ad08bfb-cbe0-4911-a8c3-309760d33029
                isPublic: false
                settings:
                  abstractScreeningDepth: thorough
                  fulltextScreeningDepth: thorough
                  useFigures: false
                links:
                  self: https://elicit.com/api/v2/sessions/systematic-reviews/5ad08bfb-cbe0-4911-a8c3-309760d33029
        '400':
          description: >-
            Invalid request. Check that the config matches the schema ÔÇö e.g.
            each enabled stage has at least one source of material (`criteria` /
            `questions` and/or `generate`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_request
                  message: >-
                    abstract screening must specify `criteria`, `generate:
                    true`, or both
        '401':
          description: >-
            Authentication failed. The API key is missing, invalid, revoked, or
            expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_api_key
                  message: Invalid API key
        '402':
          description: Insufficient quota.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: insufficient_quota
                  message: Insufficient quota.
        '403':
          description: >-
            Access denied. Either API access is not available on your plan, or
            the systematic-reviews surface requires features your plan does not
            include (guided flow, or figure extraction when `useFigures: true`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                apiAccess:
                  summary: API access not available on plan
                  value:
                    error:
                      code: api_access_denied
                      message: >-
                        API access is not available on your current plan. Please
                        upgrade to Pro or above.
                guidedFlow:
                  summary: Plan does not include systematic reviews
                  value:
                    error:
                      code: guided_flow_required
                      message: >-
                        Systematic reviews aren't included in your current plan.
                        Upgrade to a plan that includes systematic reviews to
                        create one.
                figureExtraction:
                  summary: Plan does not include reading figures
                  value:
                    error:
                      code: figure_extraction_required
                      message: >-
                        Reading figures during extraction isn't included in your
                        current plan. Upgrade, or set `extraction.useFigures` to
                        `false`.
        '429':
          description: >-
            Rate limit exceeded. More than 100 requests per minute were received
            from your IP address; further requests are blocked for 5 minutes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudflareRateLimitError'
              example:
                error: Rate limit exceeded
                message: Too many requests. Please try again later.
        '500':
          description: >-
            An unexpected error occurred. Retry reads with backoff; before
            retrying a write, check whether it took effect. See Error Handling
            for retry guidance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: internal_error
                  message: Internal server error
  /sessions/systematic-reviews/{sessionId}:
    get:
      tags:
        - Systematic Reviews
      summary: Get systematic review status and results
      description: >-
        Poll the status of a systematic review created via `POST
        /api/v2/sessions/systematic-reviews`.


        ### Status transitions


        - **processing** ÔÇö the pipeline is running. Watch progress at `url`.

        - **pausedForInsufficientQuota** ÔÇö the account exceeded its usage limit
        mid-run. The review stays paused until resumed via the `links.resume`
        URL (or the Elicit web interface) once the limit is resolved.

        - **completed** ÔÇö the pipeline finished. Stage-organized exports appear
        under `data`. Only stages that actually ran are included.

        - **failed** ÔÇö something went wrong. The `error` field contains details.
        `data` may still contain exports for stages that completed before the
        failure.

        - **unknown** ÔÇö status is not tracked (legacy or user-created).


        ### Response shape


        `data` can include stage outputs before `status: "completed"`.
        `exportsStatus` describes cache availability, not whether every
        completed stage has been exported:


        - `ready` ÔÇö a cached export manifest was served. It can be stale and
        omit newly completed stages; missing URLs do not prove that a stage did
        not run.

        - `generating` ÔÇö exports are being generated and no cached downloads are
        available yet. Poll again later.

        - `unavailable` ÔÇö export generation is temporarily unavailable. Retry
        the GET later; this is separate from the research session's `status`.


        Poll every 30ÔÇô60 seconds while processing. If the session is paused for
        insufficient quota, resolve the usage limit and POST to `links.resume`
        instead of continuing to poll for completion.


        **After completion, repoll for missing expected exports even when
        `exportsStatus` is `ready`.** Wait at least 60 seconds before fetching
        this endpoint again: a manifest younger than the 60-second cooldown can
        be served without checking newly completed stages. Older cached
        manifests can also be served while another request regenerates exports
        or when regeneration or session-state loading fails. There is no fixed
        freshness guarantee. Check `dataFreshness` to detect an unchanged cache,
        but do not treat its timestamp alone as proof that every stage is
        exported. Use bounded retries with backoff; if expected URLs remain
        missing, report incomplete export availability rather than assuming the
        stages never ran.


        - `data.search.{csv,xlsx}` ÔÇö gather-stage paper list.

        - `data.screen.{csv,xlsx}` ÔÇö abstract-screening results.

        - `data.fulltext.{csv,xlsx}` ÔÇö fulltext-screening results (only when
        fulltext screening is configured).

        - `data.extract.{csv,xlsx}` ÔÇö extraction-stage results.

        - `data.report` ÔÇö structured content under `result`, plus optional `pdf`
        / `docx` / `txt` (APA reference list) / `bib` (BibTeX) / `ris` presigned
        download URLs.


        All stage URLs are presigned for 7 days and serve with
        `Content-Disposition: attachment` so browser downloads land with the
        canonical filename.


        `dataFreshness` is the ISO timestamp of the cached export manifest used
        for this response, or `null` when no timestamp is available for the
        returned data. It is not the session's completion time or a guarantee of
        current exports.


        ### Including the full report body


        By default, `data.report.result.reportBody` and
        `data.report.result.abstract` are omitted to keep responses light.
        Append `?include=reportBody` to include them.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: sessionId
          description: >-
            The session ID (UUID) returned by the create endpoints and `GET
            /sessions`
          schema:
            type: string
            format: uuid
            description: >-
              The session ID (UUID) returned by the create endpoints and `GET
              /sessions`
            example: 5ad08bfb-cbe0-4911-a8c3-309760d33029
          required: true
        - in: query
          name: include
          description: >-
            Set to 'reportBody' to include the full report markdown and abstract
            in the response
          schema:
            type: string
            const: reportBody
            description: >-
              Set to 'reportBody' to include the full report markdown and
              abstract in the response
      responses:
        '200':
          description: >-
            Systematic review status, available stage results, and export
            availability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystematicReviewSessionDetail'
              examples:
                processing:
                  summary: Review is running
                  value:
                    type: systematicReview
                    sessionId: 5ad08bfb-cbe0-4911-a8c3-309760d33029
                    links:
                      self: https://elicit.com/api/v2/sessions/systematic-reviews/5ad08bfb-cbe0-4911-a8c3-309760d33029
                    status: processing
                    url: https://elicit.com/review/5ad08bfb-cbe0-4911-a8c3-309760d33029
                    isPublic: false
                    executionStage: gathering_sources
                    exportsStatus: ready
                    dataFreshness: null
                searchReady:
                  summary: >-
                    Review still processing ÔÇö search results already
                    downloadable
                  value:
                    executionStage: screening_abstract
                    exportsStatus: ready
                    type: systematicReview
                    sessionId: 5ad08bfb-cbe0-4911-a8c3-309760d33029
                    links:
                      self: https://elicit.com/api/v2/sessions/systematic-reviews/5ad08bfb-cbe0-4911-a8c3-309760d33029
                    status: processing
                    url: https://elicit.com/review/5ad08bfb-cbe0-4911-a8c3-309760d33029
                    isPublic: false
                    data:
                      search:
                        csv: https://s3.amazonaws.com/...
                        xlsx: https://s3.amazonaws.com/...
                    dataFreshness: '2025-06-15T14:35:42.000Z'
                completedWithReport:
                  summary: Review completed with all stages and a full report
                  value:
                    executionStage: done
                    exportsStatus: ready
                    type: systematicReview
                    sessionId: 5ad08bfb-cbe0-4911-a8c3-309760d33029
                    links:
                      self: https://elicit.com/api/v2/sessions/systematic-reviews/5ad08bfb-cbe0-4911-a8c3-309760d33029
                    status: completed
                    url: https://elicit.com/review/5ad08bfb-cbe0-4911-a8c3-309760d33029
                    isPublic: false
                    data:
                      search:
                        csv: https://s3.amazonaws.com/...
                        xlsx: https://s3.amazonaws.com/...
                      screen:
                        csv: https://s3.amazonaws.com/...
                        xlsx: https://s3.amazonaws.com/...
                      fulltext:
                        csv: https://s3.amazonaws.com/...
                        xlsx: https://s3.amazonaws.com/...
                      extract:
                        csv: https://s3.amazonaws.com/...
                        xlsx: https://s3.amazonaws.com/...
                      report:
                        result:
                          title: GLP-1 Receptor Agonists and Cardiovascular Outcomes
                          summary: >-
                            This review analyzed 42 studies examining the
                            cardiovascular effects of GLP-1 receptor agonists...
                        pdf: https://s3.amazonaws.com/...
                        docx: https://s3.amazonaws.com/...
                        txt: https://s3.amazonaws.com/...
                        bib: https://s3.amazonaws.com/...
                        ris: https://s3.amazonaws.com/...
                    dataFreshness: '2025-06-15T14:35:42.000Z'
                failedAfterScreen:
                  summary: Review failed mid-pipeline; partial exports remain available
                  value:
                    executionStage: extracting_data
                    exportsStatus: ready
                    type: systematicReview
                    sessionId: 5ad08bfb-cbe0-4911-a8c3-309760d33029
                    links:
                      self: https://elicit.com/api/v2/sessions/systematic-reviews/5ad08bfb-cbe0-4911-a8c3-309760d33029
                    status: failed
                    url: https://elicit.com/review/5ad08bfb-cbe0-4911-a8c3-309760d33029
