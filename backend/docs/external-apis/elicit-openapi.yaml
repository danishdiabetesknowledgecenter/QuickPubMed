    DownloadAgentSessionArtifactResponse:
      type: object
      properties:
        downloadUrl:
          type: string
          description: Short-lived presigned URL to download the artifact contents.
        expiresAt:
          type: string
          description: ISO 8601 timestamp after which the download URL is no longer valid.
          example: '2025-06-15T15:00:00.000Z'
        filename:
          type: string
          description: Suggested filename for the downloaded artifact.
        contentType:
          type:
            - string
            - 'null'
          description: MIME type of the artifact, when known.
      required:
        - downloadUrl
        - expiresAt
        - filename
        - contentType
    StopAgentSessionResponse:
      type: object
      properties:
        sessionId:
          type: string
          description: Unique identifier for the research agent session.
        status:
          type: string
          enum:
            - stopping
            - stopped
            - failed
          description: >-
            "stopping" when a stop was queued (the session halts asynchronously;
            poll the events endpoint for the session_stopped event). "stopped"
            or "failed" when the session had already ended and no stop was
            needed.
        url:
          type: string
          description: >-
            URL to view the session in the Elicit web interface. Only the owner
            can continue it.
      required:
        - sessionId
        - status
        - url
    RoutineList:
      type: object
      properties:
        routines:
          type: array
          items:
            $ref: '#/components/schemas/Routine'
        nextCursor:
          type:
            - string
            - 'null'
          description: Cursor for the next page, or null at the end.
      required:
        - routines
        - nextCursor
    Routine:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
        updatedAt:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
            - active
            - paused
        pauseReason:
          anyOf:
            - type: string
              enum:
                - scheduler_projection_failed
                - task_owner_lost_access
                - session_unavailable
                - session_owner_ineligible
                - owner_plan_ineligible
                - invalid_configuration
            - type: string
            - type: 'null'
        removedAt:
          type:
            - string
            - 'null'
        removedReason:
          type:
            - string
            - 'null'
          enum:
            - user
            - session_removed
            - session_deleted
            - null
        sessionId:
          type: string
        instruction:
          type: string
        schedule:
          type: object
          properties:
            cadence:
              type: string
              enum:
                - daily
                - weekly
            dayOfWeek:
              type:
                - integer
                - 'null'
              minimum: 0
              maximum: 6
            runAtLocalTime:
              type: string
              pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
            timeZone:
              type: string
          required:
            - cadence
            - dayOfWeek
            - runAtLocalTime
            - timeZone
        ownerNotificationLevel:
          type: string
          enum:
            - all_runs
            - output_or_attention
            - attention_only
      required:
        - id
        - createdAt
        - updatedAt
        - name
        - status
        - pauseReason
        - removedAt
        - removedReason
        - sessionId
        - instruction
        - schedule
        - ownerNotificationLevel
      description: >-
        A recurring Research Agent instruction. Archival is represented by a
        non-null removedAt rather than a separate status value.
