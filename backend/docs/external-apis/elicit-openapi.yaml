    LibrarySource:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Stable id of the source.
        title:
          type:
            - string
            - 'null'
        authors:
          type: array
          items:
            type: string
        year:
          type:
            - integer
            - 'null'
        venue:
          type:
            - string
            - 'null'
        abstract:
          type:
            - string
            - 'null'
          description: Abstract as markdown.
        doi:
          type:
            - string
            - 'null'
        url:
          type:
            - string
            - 'null'
        elicitId:
          type:
            - string
            - 'null'
          description: >-
            Elicit corpus id, present once the paper has been matched to the
            corpus.
        pdfUrls:
          type: array
          items:
            type: string
        collectionIds:
          type: array
          items:
            type: string
            format: uuid
          description: Collections this source belongs to that are visible to you.
        role:
          type: string
          enum:
            - writer
            - reader
          description: >-
            Your role on this source: `writer` for your own sources and for a
            shared collection's papers when you own or can edit that collection;
            `reader` for a shared collection's papers you can only view. Any
            role can read the source and use it in reviews. Writers edit
            metadata, attach a PDF, delete, and add to collections.
        fullTextStatus:
          type: string
          enum:
            - pending
            - available
            - unavailable
          description: >-
            Whether parsed full text is attached: pending ÔÇö a PDF is still
            parsing, or none has been looked for yet; available ÔÇö parsed and
            attached; unavailable ÔÇö looked for, none found.
        createdAt:
          type: string
        updatedAt:
          type: string
        links:
          type: object
          properties:
            self:
              type: string
              description: API URL of this source.
            fullText:
              type: string
              description: >-
                API URL of the parsed full text; 404s until fullTextStatus is
                available.
          required:
            - self
            - fullText
      required:
        - id
        - title
        - authors
        - year
        - venue
        - abstract
        - doi
        - url
        - elicitId
        - pdfUrls
        - collectionIds
        - role
        - fullTextStatus
        - createdAt
        - updatedAt
        - links
