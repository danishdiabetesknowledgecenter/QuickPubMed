  /sessions/agents:
    post:
      tags:
        - Research Agent
      summary: Create a Research Agent session
      description: >-
        Start a stateful Research Agent session. Elicit investigates the query
        asynchronously, reports its activity as structured events, and may
        produce downloadable artifacts.


        The response returns immediately with a `sessionId`. Use the events
        endpoint to follow the research, then send messages to refine or
        continue it. The session is also available at the returned `url`.


        ### End-to-end workflow


        A full research task may involve several requests against a single
        session. To drive it end to end:


        1. **(Optional) Upload files.** POST /api/v2/files, PUT the bytes to the
        presigned URL, and keep each `file_id` (see the Upload endpoint).

        2. **Create the session.** POST /api/v2/sessions/agents with your
        `query` and any `attachments`. The response is immediate with `status:
        "processing"` and a `sessionId`.

        3. **Poll for activity.** GET /api/v2/sessions/agents/:sessionId/events.
        Pass the returned `cursor` unchanged on each subsequent poll to receive
        immutable event occurrences not observed at that checkpoint. Append them
        in response order and deduplicate retries by `eventId`. Poll every 3ÔÇô10
        seconds while the top-level `status` is `processing`.

        4. **Detect idle.** The agent is ready for another request when a
        `session_idle` event appears and the top-level `status` returns to
        `completed`. For a Research Agent session, `completed` means **idle and
        awaiting input** ÔÇö not that the session is permanently closed. Watch for
        these events along the way:
           - `question` ÔÇö the agent needs input; answer it with a follow-up message.
           - `error` ÔÇö the agent encountered an error; `retryable` indicates whether resending is worthwhile.
           - `session_paused` ÔÇö the account hit its usage limit; the status becomes `pausedForInsufficientQuota`. Resolve the limit, then resume the session via POST /api/v2/sessions/:sessionId/resume (or the Elicit web interface) before continuing.
        5. **Send a follow-up.** POST
        /api/v2/sessions/agents/:sessionId/messages with your message (and any
        `attachments`). Correlate the returned `messageId` with the matching
        `user_message` event, then return to step 3.

        6. **Retrieve artifacts.** GET
        /api/v2/sessions/agents/:sessionId/artifacts to list what the agent
        produced: files appear under `artifacts` (GET
        .../artifacts/:artifactId/download for a short-lived presigned download
        URL ÔÇö treat it as a credential), and interactive outputs (tables, prose,
        presentations, figures) appear under `deliveredOutputs` (GET
        .../artifacts/:artifactId/content for their contents).

        7. **Retrieve cited sources.** GET
        /api/v2/sessions/agents/:sessionId/sources for every source the session
        cited, listed once each with its abstract. Join it to the citations on
        the events feed by `sourceRef`.

        8. **(Optional) Stop early.** POST
        /api/v2/sessions/agents/:sessionId/stop to interrupt a running turn,
        then poll the events endpoint for the `session_stopped` event.


        ### Session status


        The list, detail, and events endpoints all report the same top-level
        `status`:


        - `processing` ÔÇö the agent is working (or the session has not started
        yet).

        - `completed` ÔÇö idle and awaiting input; the latest work finished
        successfully.

        - `failed` ÔÇö the latest work ended with an error.

        - `pausedForInsufficientQuota` ÔÇö paused at the account usage limit;
        resume once the limit clears.


        The shared session-status schema also includes `unknown` for legacy
        reports and systematic reviews. Agent endpoints return the four statuses
        above: when no execution outcome is available and the session is not
        quota-paused, they report `processing` rather than `unknown`.


        Application errors use the standard `{ "error": { "code", "message" } }`
        envelope. The edge rate limit's `429` response is the flat format
        described under Error Handling.


        ### Example


        ```bash

        # Minimal

        curl -X POST https://elicit.com/api/v2/sessions/agents \
          -H "Authorization: Bearer elk_live_your_key_here" \
          -H "Content-Type: application/json" \
          -d '{"query":"What are the effects of GLP-1 receptor agonists on cardiovascular outcomes?"}'

        # With an uploaded file attached to the initial turn

        curl -X POST https://elicit.com/api/v2/sessions/agents \
          -H "Authorization: Bearer elk_live_your_key_here" \
          -H "Content-Type: application/json" \
          -d '{"query":"Summarize the attached trial and compare it to the current literature.","attachments":[{"file_id":"a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d"}]}'
        ```
      security:
        - BearerAuth: []
      requestBody:
        required: true
        description: Initial Research Agent query
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: >-
                    The initial query for the research agent. Elicit creates a
                    stateful research session that investigates the query. The
                    session is continuable in the Elicit web interface.
                  example: >-
                    What are the effects of GLP-1 receptor agonists on
                    cardiovascular outcomes?
                attachments:
                  type: array
                  items:
                    type: object
                    properties:
                      file_id:
                        type: string
                        format: uuid
                        description: >-
                          The file_id returned by POST /api/v2/files for a
                          previously uploaded file.
                        example: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                    required:
                      - file_id
                  maxItems: 20
                  description: >-
                    Files to attach to this turn, each referencing a file_id
                    from POST /api/v2/files. A session can hold at most 20
                    distinct files across all turns. An already-attached file
                    can be referenced again in the same session, but not claimed
                    by another session or import. Duplicate file_ids within one
                    request are rejected.
              required:
                - query
      responses:
        '202':
          description: >-
            Session creation accepted. The Research Agent is processing the
            initial query asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAgentSessionResponse'
              example:
                sessionId: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                status: processing
                url: https://elicit.com/agent/a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
        '400':
          description: >-
            Invalid request: query/message must contain 1ÔÇô2,000 characters and
            attachments must satisfy the schema (invalid_request). Attachment
            checks can also return file_not_uploaded if the upload cannot be
            verified, or file_size_mismatch if the uploaded byte length differs
            from size_bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_request
                  message: Invalid request
        '401':
          description: >-
            Authentication failed. The API key is missing, invalid, revoked, or
            expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid:
                  summary: Invalid, revoked, or expired key
                  value:
                    error:
                      code: invalid_api_key
                      message: Invalid API key
                missing:
                  summary: No Authorization header
                  value:
                    error:
                      code: missing_authorization
                      message: Authorization header is required
        '402':
          description: Insufficient quota.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: insufficient_quota
                  message: Insufficient quota.
        '403':
          description: >-
            API access is not available on your current plan. Upgrade to Pro or
            above to use the API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: api_access_denied
                  message: >-
                    API access is not available on your current plan. Please
                    upgrade to Pro or above.
        '404':
          description: >-
            An attachment file_id does not exist or belongs to another user
            (attachment_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: attachment_not_found
                  message: File was not found.
        '409':
          description: >-
            An attachment belongs to another session/import
            (attachment_already_used), or adding files would exceed the 20-file
            session cap (too_many_files).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: attachment_already_used
                  message: File has already been used.
        '410':
          description: >-
            An unclaimed upload expired. Stage and upload it again before
            attaching it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: attachment_expired
                  message: Attachment upload has expired.
        '429':
          description: >-
            Rate limit exceeded. More than 100 requests per minute were received
            from your IP address; further requests are blocked for 5 minutes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudflareRateLimitError'
              example:
                error: Rate limit exceeded
                message: Too many requests. Please try again later.
        '500':
          description: >-
            An unexpected error occurred. Retry reads with backoff; before
            retrying a write, check whether it took effect. See Error Handling
            for retry guidance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: internal_error
                  message: Internal server error
        '504':
          description: >-
            Session startup exceeded the 30-second deadline (timeout). Check the
            session list before retrying; do not assume a network timeout means
            no work was created.
          content:
            application/json:
              schema:
