  /sessions:
    get:
      tags:
        - Sessions
      summary: List sessions
      description: >-
        List all sessions ÔÇö reports, systematic reviews, and research-agent
        sessions ÔÇö for the authenticated user in a single feed, ordered by
        creation date (newest first).


        Each item carries its `sessionId`, a `type` field (`report`,
        `systematicReview`, or `agent`), and a `links` object with the URLs for
        the item's follow-up requests: `links.self` is the typed get endpoint
        for its full status and results, and `links.resume` appears only while
        the session is paused for insufficient quota. Agent items omit
        `executionStage` (agent sessions have no pipeline stages); for them
        `status: "completed"` means idle and awaiting input rather than
        terminally finished.


        Results are paginated using cursor-based pagination. Use the
        `nextCursor` value from the response to fetch the next page. Filters
        apply to all session types; pass `type` to list a single kind.


        ### Example


        ```bash

        # First page

        curl https://elicit.com/api/v2/sessions?limit=10 \
          -H "Authorization: Bearer elk_live_your_key_here"

        # Next page

        curl
        "https://elicit.com/api/v2/sessions?limit=10&cursor=2025-06-15T14:30:00.000Z_5ad08bfb-cbe0-4911-a8c3-309760d33029"
        \
          -H "Authorization: Bearer elk_live_your_key_here"

        # Only reports created via the API

        curl "https://elicit.com/api/v2/sessions?type=report&source=api" \
          -H "Authorization: Bearer elk_live_your_key_here"
        ```
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: limit
          description: 'Maximum number of sessions to return (default: 50, max: 100)'
          schema:
            type: integer
            minimum: 1
            maximum: 100
            description: 'Maximum number of sessions to return (default: 50, max: 100)'
            example: 20
        - in: query
          name: cursor
          description: >-
            Opaque pagination cursor from a previous response's nextCursor
            field. Omit for the first page.
          schema:
            type: string
            description: >-
              Opaque pagination cursor from a previous response's nextCursor
              field. Omit for the first page.
            example: 2025-06-15T14:30:00.000Z_5ad08bfb-cbe0-4911-a8c3-309760d33029
        - in: query
          name: source
          description: Filter by how the session was created
          schema:
            type: string
            enum:
              - user
              - api
              - mcp
              - agent_session
            description: Filter by how the session was created
            example: api
        - in: query
          name: type
          description: Filter to a single session type
          schema:
            type: string
            enum:
              - report
              - systematicReview
              - agent
            description: Filter to a single session type
            example: report
        - in: query
          name: status
          description: Filter by session status
          schema:
            type: string
            enum:
              - processing
              - pausedForInsufficientQuota
              - completed
              - failed
              - unknown
            description: Filter by session status
            example: completed
      responses:
        '200':
          description: List of sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSessionsResponse'
              example:
                sessions:
                  - type: report
                    sessionId: 5ad08bfb-cbe0-4911-a8c3-309760d33029
                    status: completed
                    executionStage: done
                    title: >-
                      What are the effects of GLP-1 receptor agonists on
                      cardiovascular outcomes?
                    url: https://elicit.com/review/5ad08bfb-cbe0-4911-a8c3-309760d33029
                    source: api
                    createdAt: '2025-06-15T14:30:00.000Z'
                    isPublic: false
                    links:
                      self: https://elicit.com/api/v2/sessions/reports/5ad08bfb-cbe0-4911-a8c3-309760d33029
                  - type: systematicReview
                    sessionId: e3d0f5c4-88f6-4c3f-b6a3-0b57a2f1d3aa
                    status: pausedForInsufficientQuota
                    executionStage: screening_abstract
                    title: Do GLP-1 receptor agonists reduce MACE in T2D patients?
                    url: https://elicit.com/review/e3d0f5c4-88f6-4c3f-b6a3-0b57a2f1d3aa
                    source: user
                    createdAt: '2025-06-14T09:12:00.000Z'
