        - spentUsdCents
    CreateAgentSessionResponse:
      type: object
      properties:
        sessionId:
          type: string
          description: Unique identifier for the research agent session.
          example: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
        status:
          type: string
          const: processing
          description: Initial status is always processing.
        url:
          type: string
          description: >-
            URL to view the session in the Elicit web interface. Only the owner
            can continue it.
          example: https://elicit.com/agent/a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
      required:
        - sessionId
        - status
        - url
    AgentSessionDetail:
      type: object
      properties:
        type:
          type: string
          const: agent
          description: Discriminator identifying this as a research-agent session.
        sessionId:
          type: string
          format: uuid
          description: >-
            The session ID (UUID) returned by the create endpoints and `GET
            /sessions`
          example: 5ad08bfb-cbe0-4911-a8c3-309760d33029
        status:
          type: string
          enum:
            - processing
            - pausedForInsufficientQuota
            - completed
            - failed
            - unknown
          description: >-
            Current status of the session: "processing" (running, or not yet
            started), "completed" (idle and awaiting input ÔÇö not terminally
            finished), "failed" (the last turn ended with an error), or
            "pausedForInsufficientQuota" (paused at the account usage limit;
            resume once the limit clears).
        title:
          type: string
          description: Human-readable title of the session.
        url:
          type: string
          description: >-
            URL to view the session in the Elicit web interface. Available
            actions depend on your permissions.
        source:
          type: string
          enum:
            - user
            - api
            - mcp
            - agent_session
          description: How the session was created.
          example: api
        createdAt:
          type: string
          description: ISO 8601 timestamp of when the session was created.
          example: '2025-06-15T14:30:00.000Z'
        isPublic:
          type: boolean
          description: >-
            Whether the session is publicly accessible via its URL without
            authentication.
        links:
          $ref: '#/components/schemas/SessionLinks'
      required:
        - type
        - sessionId
        - status
        - title
        - url
        - source
        - createdAt
        - isPublic
        - links
    GetAgentSessionEventsResponse:
      type: object
      properties:
        sessionId:
          type: string
          description: Unique identifier for the research agent session.
        status:
          type: string
          enum:
            - processing
            - pausedForInsufficientQuota
            - completed
            - failed
            - unknown
          description: >-
            Current status of the session. Uses exactly the same value and
            semantics as the list and detail endpoints.
        events:
          type: array
          items:
            $ref: '#/components/schemas/ReducedAgentEvent'
          description: >-
            Append-only view of the session's activity. Streaming deltas are
            collapsed into immutable resource snapshots; raw stream events are
            never returned. Later snapshots retain the same resource ID and
            receive a new eventId. With no cursor this is the full history; with
            a cursor it contains only later occurrences.
        cursor:
          type: string
          description: >-
            Opaque session-bound checkpoint. Always present. Pass it unchanged
            as the `cursor` query param on the next poll to receive later event
            occurrences.
        url:
          type: string
          description: >-
            URL to view the session in the Elicit web interface. Only the owner
            can continue it.
      required:
        - sessionId
        - status
        - events
        - cursor
        - url
    ReducedAgentEvent:
      oneOf:
        - type: object
          properties:
            eventId:
              type: string
              description: >-
                Stable opaque identifier for this immutable public event
                occurrence.
            createdAt:
              type:
                - string
                - 'null'
              description: >-
                ISO 8601 timestamp for the event. Null for historical events
                without one.
            kind:
              type: string
              const: user_message
            messageId:
              type: string
            text:
              type: string
            isInitial:
              type: boolean
          required:
            - eventId
            - createdAt
            - kind
            - messageId
            - text
            - isInitial
        - type: object
          properties:
            eventId:
              type: string
              description: >-
                Stable opaque identifier for this immutable public event
                occurrence.
            createdAt:
              type:
                - string
                - 'null'
              description: >-
                ISO 8601 timestamp for the event. Null for historical events
                without one.
            kind:
              type: string
              const: agent_message
            messageId:
              type: string
            text:
              type: string
              description: >-
                The agent's reply. Contains inline `<citations>ÔÇª</citations>`
                markup wrapping one or more comma-separated reference tokens;
                split them and match each token against `citations[].reference`
                to resolve it. Strip the markup for display.
            citations:
              type: array
              items:
                type: object
                properties:
                  citationId:
                    type: string
                    description: Identifier for this citation within the agent message.
                  reference:
                    type:
                      - string
                      - 'null'
                    description: >-
                      The inline citation this entry resolves. It matches,
                      character for character, a single reference token inside
                      the `<citations>ÔÇª</citations>` markup in the message text
                      (one entry per token, after comma-separated tokens are
                      split). Use it to map inline references in the text to
                      this citation; use the `source` field to identify the
                      underlying source. `null` for citations with no inline
                      reference (e.g. legacy quotes-array or artifact-content
                      citations).
                  quote:
                    type: string
                    description: The passage from the source that supports the message.
                  source:
                    type: object
                    properties:
                      sourceRef:
                        type: string
                        description: >-
                          Opaque identifier for the underlying source, stable
                          everywhere it appears in a session (message citations,
                          table cells, and the cited-sources endpoint). Use it
                          to deduplicate citations and to join a citation to its
                          entry from the session's cited-sources endpoint, which
                          additionally carries the abstract. Never a raw
                          internal id; do not construct or decode it.
                      title:
                        type:
                          - string
                          - 'null'
                        description: Title of the cited work.
                      authors:
                        type: array
                        items:
                          type: string
                        description: Authors of the cited work, in display order.
                      year:
                        type:
                          - integer
                          - 'null'
                        description: Publication year.
                      doi:
                        type:
                          - string
                          - 'null'
                        description: Digital Object Identifier (DOI), when available.
                      url:
                        type:
                          - string
                          - 'null'
                        description: Best available URL for the cited work.
                      venue:
                        type:
                          - string
                          - 'null'
                        description: >-
                          Journal, conference, repository, or other publication
                          venue.
                      citationCount:
                        type:
                          - integer
                          - 'null'
                        description: Number of works citing this source, when known.
                      fullTextAvailable:
                        type:
                          - boolean
                          - 'null'
                        description: >-
                          Whether the source's full text (rather than the
                          abstract alone) is available. Null when the session
                          recorded no verdict ÔÇö most often on the events feed,
                          which reports only what the session itself recorded.
                          The cited-sources endpoint resolves those unknowns and
                          is the reliable place to read this field.
                      studyTypeTags:
                        type: array
                        items:
                          type: string
                        description: >-
                          Study-design tags for the source, when classified
                          (e.g. "Randomized Controlled Trial", "Meta-Analysis").
                      journalQuartile:
                        type:
                          - integer
                          - 'null'
                        minimum: 1
                        maximum: 4
                        description: >-
                          Journal ranking quartile from 1 (highest) to 4, when
                          known.
                      elicitId:
                        type:
                          - string
                          - 'null'
                        description: >-
                          Elicit's identifier for the source, when it is in the
                          Elicit corpus.
                    required:
                      - sourceRef
                      - title
                      - authors
                      - year
                      - doi
                      - url
                      - venue
                      - citationCount
                      - fullTextAvailable
                      - studyTypeTags
                      - journalQuartile
                      - elicitId
                required:
                  - citationId
                  - reference
                  - quote
                  - source
            suggestedFollowUps:
              type: array
              items:
                type: string
          required:
            - eventId
            - createdAt
            - kind
            - messageId
            - text
            - citations
            - suggestedFollowUps
        - type: object
          properties:
            eventId:
              type: string
              description: >-
                Stable opaque identifier for this immutable public event
                occurrence.
            createdAt:
              type:
                - string
                - 'null'
              description: >-
                ISO 8601 timestamp for the event. Null for historical events
                without one.
            kind:
              type: string
              const: methods
            messageId:
              type: string
              description: >-
                The agent_message this methods record describes. Emitted once
                per answer, after that message.
            approach:
              type: string
              description: One sentence stating the kind of research performed.
            summary:
              type:
                - string
                - 'null'
              description: >-
                A short summary of the method: what was searched, assembled, and
                compared. Null when the agent recorded no summary.
            sections:
              type: array
              items:
                type: object
                properties:
                  heading:
                    type: string
                  body:
                    type: string
                required:
                  - heading
                  - body
              description: >-
                Headed prose sections describing the research process (e.g.
                "Evidence selection", "Practical translation"), in display
                order.
            keyJudgments:
              type: array
              items:
                type: string
              description: The judgment calls the agent made while producing the answer.
            searches:
              type: array
              items:
                type: object
                properties:
                  source:
                    type: string
                    description: >-
                      The corpus searched, as a stable key rather than a display
                      label: "academic" (Elicit's academic corpus), "pubmed",
                      "clinical_trials", "press_release", or "web". Other values
                      are possible as corpora are added.
                  query:
                    type: string
                  maxResults:
                    type:
                      - integer
                      - 'null'
                    description: The result cap requested for this query, when one was set.
                  resultsCount:
                    type:
                      - integer
                      - 'null'
                    description: How many results the query returned, when known.
                  searchedAt:
                    type:
                      - string
                      - 'null'
                    description: ISO 8601 timestamp of when the query ran, when known.
                required:
                  - source
                  - query
                  - maxResults
                  - resultsCount
                  - searchedAt
              description: >-
                The searches behind the answer, deduplicated by corpus and query
                in execution order.
            evidenceBase:
              type:
                - object
                - 'null'
              properties:
                sourceCount:
                  type: integer
                  description: >-
                    Number of distinct sources the answer drew on, across its
                    citations and any artifacts it referenced ÔÇö a source counts
                    as cited when a quote names it or a table row links to it in
                    an artifact the answer produced or referenced, delivered or
                    not. Lower than the citation count when one source supports
                    several citations, and higher than the count on the web
                    interface's Methods card for a session with a source-table
                    column, which counts only quoted sources.
                earliestYear:
                  type:
                    - integer
                    - 'null'
                latestYear:
                  type:
                    - integer
                    - 'null'
              required:
                - sourceCount
                - earliestYear
                - latestYear
              description: Coverage of the cited evidence. Null when no source resolved.
            artifacts:
              type: array
              items:
                type: object
                properties:
                  artifactId:
                    type:
                      - string
                      - 'null'
                    description: >-
                      The delivered artifact this methods record references,
                      matching the id on the artifacts endpoint. Null when the
                      referenced entity was never delivered as an artifact.
                  title:
                    type: string
                required:
                  - artifactId
                  - title
              description: Artifacts the described method produced.
          required:
            - eventId
            - createdAt
            - kind
            - messageId
            - approach
            - summary
            - sections
            - keyJudgments
            - searches
            - evidenceBase
            - artifacts
        - type: object
          properties:
            eventId:
              type: string
              description: >-
                Stable opaque identifier for this immutable public event
                occurrence.
            createdAt:
              type:
                - string
                - 'null'
              description: >-
                ISO 8601 timestamp for the event. Null for historical events
                without one.
            kind:
              type: string
              const: question
            questionId:
              type: string
            text:
              type: string
            responseFormat:
              type: string
              enum:
                - text
                - single_select
                - multi_select
            options:
              type:
                - array
                - 'null'
              items:
                type: object
                properties:
                  optionId:
