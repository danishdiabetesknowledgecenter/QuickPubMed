                    dataFreshness: '2025-06-15T14:35:42.000Z'
        '400':
          description: The request body, query parameters, or path ID failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_request
                  message: Invalid request
        '401':
          description: Authentication failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_api_key
                  message: Invalid API key
        '403':
          description: >-
            API access is not available on your current plan. Upgrade to Pro or
