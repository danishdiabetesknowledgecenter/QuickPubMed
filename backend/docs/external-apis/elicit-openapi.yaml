            format: uuid
          required: true
      responses:
        '200':
          description: Skills available to the session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAgentSessionSkillsResponse'
              example:
                sessionId: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
