openapi: 3.1.0
info:
  title: Mugin Scholar Public Search API
  version: "1.0.0"
  description: |
    Host-uafhængig versioneret søge-API for Mugin Scholar.
    POST /v1/search er den officielle kontrakt (JSON eller form-urlencoded).
    GET /v1/search accepterer samme flade SearchForm-parametre i query-string
    (UI-only params ignoreres; gentagne limit=/topic= bevares;
    qpubmed/qsemanticscholar/qopenalex/qelicit vinder over fritekst).

    OpenAI Custom GPT Actions:
    1) Actions → Create new action → import this OpenAPI file (or paste).
    2) Set servers[0].url to your public-api host.
    3) Authentication: API Key header X-API-Key (or Bearer).
    4) Prefer POST /v1/search (operationId searchLiterature) with JSON only.
    5) Keep page.size at 5–10 (ChatGPT ~45s timeout). Prefer pubmed+openAlex.
    6) responseOptions.stream must be false; avoid includeProcessDetails.
servers:
  - url: https://{api-host}
    variables:
      api-host:
        default: api.example.com
paths:
  /v1/search:
    get:
      summary: URL-baseret søgning (SearchForm query-string)
      description: |
        Accepterer samme flade parametre som SearchForm / form-urlencoded POST
        (`topic`, gentagne `limit=`, `databases`, `ai`, `focus`, `selected`, `pmid`,
        `qpubmed` / `qsemanticscholar` / `qopenalex` / `qelicit`, …).
        UI-only parametre (`advanced`, `collapsed`, `scrollto`, `component`, …) ignoreres.
        Query-string `apikey` (canonical lowercase; casing ignored) er kun tilgængelig når deploymenten tillader det.
        Ved lange payloads foretrækkes form-urlencoded POST.
      security:
        - ApiKeyHeader: []
        - BearerAuth: []
        - ApiKeyQuery: []
      parameters:
        - in: query
          name: q
          required: false
          schema:
            type: string
          description: "Søgetekst (eller brug custom topic={{tekst}}#s:raw)"
        - in: query
          name: topic
          required: false
          schema:
            type: string
          description: "Custom {{tekst}}#s:raw / {{pubmed}}#s:pubmed og/eller katalog-topic-id’er (gentag topic=). Legacy {{tekst0}}#s / {{tekst1}}#s accepteres."
        - in: query
          name: qpubmed
          required: false
          schema:
            type: string
            maxLength: 20000
          description: "Eksekverbar PubMed emne/fritekst-streng. Vinder over q/topic for pubmed. En ikke-tom q* for en valgt kilde er nok uden q/topic. limit=/hardFilterQuery AND’es stadig. Ingen komma-split."
        - in: query
          name: qsemanticscholar
          required: false
          schema:
            type: string
            maxLength: 20000
          description: "Eksekverbar Semantic Scholar-søgestreng. Vinder over q/topic for semanticScholar."
        - in: query
          name: qopenalex
          required: false
          schema:
            type: string
            maxLength: 20000
          description: "Eksekverbar OpenAlex-søgestreng. Vinder over q/topic for openAlex."
        - in: query
          name: qelicit
          required: false
          schema:
            type: string
            maxLength: 20000
          description: "Eksekverbar Elicit-søgestreng. Vinder over q/topic for elicit."
        - in: query
          name: sources
          required: false
          schema:
            type: string
          description: Kommasepareret liste, fx `pubmed,openAlex`
        - in: query
          name: databases
          required: false
          schema:
            type: string
          description: Alias for sources (SearchForm-navnet)
        - in: query
          name: limit
          required: false
          schema:
            type: string
          description: "id#scope,… (OR inden for værdi). Gentag limit= for AND mellem grupper."
        - in: query
          name: sort
          required: false
          schema:
            $ref: '#/components/schemas/SortMethod'
        - in: query
          name: focus
          required: false
          schema:
            $ref: '#/components/schemas/FocusProfile'
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: pagesize
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Alias for pageSize (SearchForm-navnet)
        - in: query
          name: translation
          required: false
          schema:
            type: string
            enum: [auto, none]
            default: auto
        - in: query
          name: ai
          required: false
          schema:
            type: boolean
          description: Alias for translation (SearchForm-navnet)
        - in: query
          name: selected
          required: false
          schema:
            type: string
          description: >-
            Kommaseparerede artikel-id’er til preselectedResults.
            Format: pmid:12345678,doi:10.1234/abc. Rene PMID-tal accepteres.
        - in: query
          name: pmid
          required: false
          schema:
            type: string
          description: Legacy alias for selected (rene PMID’er eller doi:…-tokens)
        - in: query
          name: apikey
          required: false
          schema:
            type: string
          description: Canonical lowercase; `apiKey` and other casings are accepted.
        - in: query
          name: stream
          required: false
          schema:
            type: boolean
            default: false
        - in: query
          name: lang
          required: false
          schema:
            type: string
            enum: [da, en]
            default: da
        - in: query
          name: nocache
          required: false
          schema:
            type: boolean
            default: false
          description: >-
            Spring search-response- og LLM-slutrerank-cache over for dette kald.
            Sletter ikke runtime-cache; skriver stadig friske resultater tilbage.
            JSON-ækvivalent: responseOptions.noCache.
      responses:
        "200":
          description: Search response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'
        "422":
          $ref: '#/components/responses/ValidationError'
        "429":
          $ref: '#/components/responses/RateLimited'
        "502":
          $ref: '#/components/responses/BadGateway'
        "503":
          $ref: '#/components/responses/Busy'
    post:
      operationId: searchLiterature
      summary: Officiel integrationssøgning
      x-openai-isConsequential: false
      security:
        - ApiKeyHeader: []
        - BearerAuth: []
      parameters:
        - in: query
          name: stream
          required: false
          schema:
            type: boolean
            default: false
          description: "URL-override for streaming. Hvis sat, vinder den over responseOptions.stream."
        - in: query
          name: lang
          required: false
          schema:
            type: string
            enum: [da, en]
            default: da
          description: "URL-override for sproget i progress-tekster."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: true
              properties:
                q:
                  type: string
                  description: >-
                    Søgetekst (alias query; topic={{tekst}}#s:raw accepteres også).
                    Valgfri når katalog-topic-id’er eller custom topic= er sat.
                query:
                  type: string
                topic:
                  type: string
                  description: "Custom {{tekst}}#s:raw / {{pubmed}}#s:pubmed eller katalog-topic-id’er (komma). Legacy {{tekst0}}#s / {{tekst1}}#s accepteres."
                qpubmed:
                  type: string
                  maxLength: 20000
                  description: "Eksekverbar PubMed emne/fritekst-streng. Vinder over q/topic for pubmed. En ikke-tom q* for en valgt kilde er nok uden q/topic. limit=/hardFilterQuery AND’es stadig. Ingen komma-split."
                qsemanticscholar:
                  type: string
                  maxLength: 20000
                  description: "Eksekverbar Semantic Scholar-søgestreng. Vinder over q/topic for semanticScholar."
                qopenalex:
                  type: string
                  maxLength: 20000
                  description: "Eksekverbar OpenAlex-søgestreng. Vinder over q/topic for openAlex."
                qelicit:
                  type: string
                  maxLength: 20000
                  description: "Eksekverbar Elicit-søgestreng. Vinder over q/topic for elicit."
                databases:
                  type: string
                  description: Kommaseparerede kilder (alias sources)
                sources:
                  type: string
                ai:
                  type: string
                  description: true/false (alias translation)
                focus:
                  $ref: '#/components/schemas/FocusProfile'
                sort:
                  $ref: '#/components/schemas/SortMethod'
                page:
                  type: integer
                pagesize:
                  type: integer
                limit:
                  type: string
                  description: >-
                    Én AND-gruppe: id#scope,... (OR inden for gruppen; default scope #s).
                    Gentag limit= for flere AND-grupper (samme semantik som SearchForm).
                pmid:
                  type: string
                  description: Kommaseparerede PMID’er til preselect
                lang:
                  type: string
                  enum: [da, en]
                stream:
                  type: string
                nocache:
                  type: string
                  description: "1/true springer search-response- og LLM-slutrerank-cache over"
            encoding:
              databases:
                style: form
                explode: false
      responses:
        "200":
          description: Search response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          $ref: '#/components/responses/ValidationError'
        "429":
          $ref: '#/components/responses/RateLimited'
        "502":
          $ref: '#/components/responses/BadGateway'
        "503":
          $ref: '#/components/responses/Busy'
  /v1/health:
    get:
      operationId: checkHealth
      summary: Health endpoint
      x-openai-isConsequential: false
      responses:
        "200":
          description: Health response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  status:
                    type: string
                  service:
                    type: string
                  version:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  config:
                    type: object
  /v1/openapi.yaml:
    get:
      summary: OpenAPI dokument
      responses:
        "200":
          description: OpenAPI YAML
          content:
            application/yaml:
              schema:
                type: string
components:
  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    ApiKeyQuery:
      type: apiKey
      in: query
      name: apikey
      description: Canonical lowercase; casing is ignored by the server.
    BearerAuth:
      type: http
      scheme: bearer
  responses:
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Client origin is not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MethodNotAllowed:
      description: Method or route variant is disabled
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Client rate limit exceeded
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - type: object
                properties:
                  rateLimit:
                    $ref: '#/components/schemas/RateLimit'
    BadGateway:
      description: Upstream provider error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Busy:
      description: Serveren er midlertidigt fuldt optaget
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - type: object
                properties:
                  retryAfterSeconds:
                    type: integer
                  concurrentSearchLimit:
                    type: integer
  schemas:
    Source:
      type: string
      enum:
        - pubmed
        - semanticScholar
        - openAlex
        - elicit
    SortMethod:
      type: string
      enum:
        - relevance
        - date_desc
        - date_asc
      default: relevance
    FocusProfile:
      type: string
      description: >-
        Rerank-profil-id. Tom streng betyder "ingen profil-override" (standard-vaegte).
        Ukendt vaerdi normaliseres til tom streng. Med
        MUGIN_UNIFIED_SEARCH_ENGINE_ENABLED=true anvender PHP-orkestratoren de
        fulde hybrid-profiler (kilde-vaegte, pmid-/overlap-bonus, pubType-tier,
        recency, citation impact, kliniske bonusser, data-quality m.m.).
        Naar flaget er false, begrænses focus til den ældre RRF-only-sti.
      enum:
        - ""
        - balanced
        - highest-evidence
        - clinical-practice
        - newest-research
        - broad-mapping
      default: ""
    SearchRequest:
      type: object
      additionalProperties: false
      required:
        - sources
      properties:
        apiVersion:
          type: string
          const: "1"
          description: Valgfri; default "1" hvis udeladt.
        query:
          type: object
          additionalProperties: false
          description: >-
            Valgfri når intentContext/topic-katalog leverer emner.
            query.text er påkrævet kun hvis der hverken er katalog-topic-id’er
            eller custom topic-tekst.
          properties:
            text:
              type: string
            language:
              type: string
              enum: [auto, da, en]
        domain:
          type: string
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
          minItems: 1
          uniqueItems: true
        sort:
          type: object
          additionalProperties: false
          properties:
            method:
              $ref: '#/components/schemas/SortMethod'
        focus:
          $ref: '#/components/schemas/FocusProfile'
        page:
          type: object
          additionalProperties: false
          properties:
            number:
              type: integer
              minimum: 1
              default: 1
            size:
              type: integer
              minimum: 1
              maximum: 100
              default: 25
            offset:
              type: integer
              minimum: 0
              description: >-
                Valgfri absolut offset i den ordnede kandidatliste. Når sat,
                bruges den i stedet for (number-1)*size til at vælge vinduet
                af resultater. Nyttig til cursor-agtig pagination.
        translation:
          type: object
          additionalProperties: false
          properties:
            mode:
              type: string
              enum: [auto, none]
              default: auto
        responseOptions:
          type: object
          additionalProperties: false
          properties:
            includeAbstracts:
              type: boolean
            includeResolvedQueries:
              type: boolean
            includeDiagnostics:
              type: boolean
            stream:
              type: boolean
            language:
              type: string
              enum: [da, en]
            includeProcessDetails:
              type: boolean
              description: >-
                Inkluderer et detaljeret processDetails-objekt i success-svar
                og på fejlveje (422/5xx), når collector findes. Aktiverer internt
                også resolved queries/diagnostics for den pågældende request
                (samme trin/kilde-diagnostik som webapp-widgeten).
            noCache:
              type: boolean
              default: false
              description: >-
                Spring search-response- og LLM-slutrerank-cache over for dette kald
                (ækvivalent med query-parametern nocache=1).
        intentContext:
          type: object
          additionalProperties: false
          description: "Ekstra hint om brugerens valg i soegeformularen, brugt til at berige AI-oversaettelse og udtraek af semantisk hensigt."
          properties:
            rawUserInput:
              type: string
            contextualSearchInput:
              type: string
            selectedTopicIds:
              type: array
              items:
                type: string
            selectedLimitIds:
              type: array
              items:
                type: string
            selectedLimitSelections:
              type: array
              description: Per-id scope (narrow/normal/broad) for PubMed searchStrings.
              items:
                type: object
                additionalProperties: false
                properties:
                  id:
                    type: string
                  scope:
                    type: string
                    enum: [narrow, normal, broad]
            selectedTopics:
              type: array
              description: Sprogneutral/engelsk visningskontekst; ikke bindende filterværdier.
              items:
                type: string
            selectedLimits:
              type: array
              description: Sprogneutral/engelsk visningskontekst; ikke bindende filterværdier.
              items:
                type: string
            semanticBlocks:
              type: array
              items:
                type: string
            ruleIds:
              type: array
              items:
                type: string
        preselectedPmids:
          type: array
          description: Legacy PMID-liste. Foretræk `selected`. Hydreres til preselectedResults (påvirker ikke search-query/total).
          items:
            type: string
          maxItems: 50
        selected:
          type: array
          description: >-
            Markerede artikler som typed tokens (`pmid:12345678`, `doi:10.1234/abc`)
            eller rene PMID-tal. Hydreres til preselectedResults (påvirker ikke search-query/total).
          items:
            type: string
          maxItems: 50
        queryOverrides:
          type: object
          additionalProperties: false
          description: >-
            Valgfrie eksekverbare queries der erstatter de genererede strenge
            efter resolve og før kilde-fetch. Tomme værdier ignoreres.
            Feltet skal udelades helt når der ikke er overrides (ikke send {}).
            JSON POST bruger dette objekt. GET/form-urlencoded bruger qpubmed,
            qsemanticscholar, qopenalex og qelicit. Overrides vinder over fritekst.
          properties:
            pubmed:
              type: string
              maxLength: 20000
              description: PubMed emne/fritekst-streng. hardFilterQuery/limit= AND’es stadig.
            semanticScholar:
              type: string
              maxLength: 20000
            openAlex:
              type: string
              maxLength: 20000
            elicit:
              type: string
              maxLength: 20000
        cachedFreetextQueries:
          type: object
          additionalProperties: false
          description: >-
            Valgfri genbrug af en tidligere fritekst-oversættelse i samme session.
            `input` skal matche query.text. pubmed er kun fritekst-clausen
            (emner/afgrænsninger AND’es stadig). Udelad feltet når der ikke er cache.
            Gælder kun JSON POST — ikke GET/flat-params.
          properties:
            input:
              type: string
              maxLength: 20000
            pubmed:
              type: string
              maxLength: 20000
            semanticScholar:
              type: string
              maxLength: 20000
            openAlex:
              type: string
              maxLength: 20000
            elicit:
              type: string
              maxLength: 20000
        standardString:
          type: object
          additionalProperties: false
          description: >-
            Styrer om domænets standardString (eller en override) AND’es på
            fritekst. add:false forhindrer AND på fritekst. Katalog-emner
            bruger stadig combineWithStandardString. Udelad feltet for hidtidig
            adfærd. Gælder kun JSON POST.
          properties:
            add:
              type: boolean
            text:
              type: string
              maxLength: 20000
              description: Valgfri override. Tom værdi bruger domænets standardString.
            scope:
              type: string
              enum: [narrow, normal, broad]
              description: Hvilken variant der AND’es på fritekst. Default normal.
        hardFilters:
          type: object
          additionalProperties: false
          properties:
            filterProfiles:
              type: array
              items:
                type: string
            languages:
              type: array
              items:
                type: string
            publicationYear:
              type: string
              description: YYYY or YYYY-YYYY
            publicationDateYears:
              type: array
              items:
                type: integer
            publicationTypes:
              type: array
              items:
                type: string
            studyDesigns:
              type: array
              items:
                type: string
            ageGroups:
              type: array
              items:
                type: string
            sourceFormats:
              type: array
              items:
                type: string
            doiOnlyRuleIds:
              type: array
              items:
                type: string
            postValidationRuleIds:
              type: array
              items:
                type: string
        sourceFilters:
          type: object
          additionalProperties: false
          properties:
            semanticScholar:
              type: object
              additionalProperties: false
              properties:
                publicationTypes:
                  type: array
                  items:
                    type: string
                publicationDateOrYear:
                  type: string
                year:
                  type: string
            openAlex:
              type: object
              additionalProperties: false
              properties:
                language:
                  type: array
                  items:
                    type: string
                sourceType:
                  type: array
                  items:
                    type: string
                workType:
                  type: array
                  items:
                    type: string
                publicationYear:
                  type: string
            elicit:
              type: object
              additionalProperties: false
              properties:
                typeTags:
                  type: array
                  items:
                    type: string
                includeKeywords:
                  type: array
                  items:
                    type: string
                excludeKeywords:
                  type: array
                  items:
                    type: string
    SearchResponse:
      type: object
      additionalProperties: true
      properties:
        apiVersion:
          type: string
        query:
          type: object
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
        focus:
          $ref: '#/components/schemas/FocusProfile'
        page:
          type: object
        total:
          type: integer
        partial:
          type: boolean
        warnings:
          type: array
          items:
            type: string
        selection:
          type: object
          description: Echo of selected SearchForm topics/limits (always present).
          additionalProperties: false
          properties:
            domain:
              type: string
            topics:
              type: array
              items:
                type: object
                additionalProperties: true
            limits:
              type: array
              items:
                type: object
                additionalProperties: true
        order:
          type: object
          additionalProperties: false
          properties:
            requestedMethod:
              $ref: '#/components/schemas/SortMethod'
            appliedMethod:
              $ref: '#/components/schemas/SortMethod'
            finalStage:
              type: string
            matchesWebOrdering:
              type: boolean
              description: >-
                Spejler MUGIN_PUBLIC_API.matchesWebOrderingByDefault.
                Web og public API deler allerede samme orkestrator
                (UnifiedSearch / muginPublicSearchRunSearch); feltet er et
                konfigurationssignal, ikke en runtime-måling.
        resolvedQueries:
          type: object
          additionalProperties: true
        diagnostics:
          type: object
          additionalProperties: true
        processDetails:
          type: object
          additionalProperties: true
          description: >
            Detaljeret trin-for-trin og kilde-diagnostik for søgeprocessen
            (sourceQueryDetails + processStepDetails). Kun til stede når
            responseOptions.includeProcessDetails=true. Payloads er sprogneutrale,
            trunkerede (fx top 10 eksempler) og redigerede for secrets
            (apiKey/Authorization/headers m.m.).
        rateLimit:
          $ref: '#/components/schemas/RateLimit'
        timing:
          type: object
          additionalProperties: false
          properties:
            startedAt:
              type: string
              format: date-time
            completedAt:
              type: string
              format: date-time
            durationMs:
              type: integer
            durationFormatted:
              type: string
              description: "Forloebet tid i tt:mm:ss-format, fx 00:00:01."
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
        preselectedResults:
          type: array
          description: Artikler hydreret fra request selected/preselectedPmids/pmid (pin/markering; uden for ranking-total).
          items:
            type: object
            additionalProperties: true
    SearchResult:
      type: object
      additionalProperties: false
      properties:
        # Identifikation
        rank:
          type: integer
        resultKey:
          type: string
        type:
          type: string
          enum: [pmid, doi]
        pmid:
          type: string
        doi:
          type: string
        pmcId:
          type: string
        # Bibliografiske kernedata
        title:
          type: string
        authors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
                description: >-
                  Normaliseret visningsnavn, "Efternavn Initialer" (fx "Setzler M"),
                  naar et efternavn er kendt. Ensartet uanset kilde.
              familyName:
                type: string
              givenName:
                type: string
              initials:
                type: string
        journal:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
            issn:
              type: string
            volume:
              type: string
            issue:
              type: string
            pages:
              type: string
        sourceLabel:
          type: string
        publicationDate:
          type: string
        year:
          type: string
        language:
          type: string
        publicationTypes:
          type: array
          items:
            type: string
        topics:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              label:
                type: string
              source:
                type: string
                enum:
                  - mesh
                  - pubmedKeyword
                  - openAlex
                  - openAlexTopic
                  - openAlexSubfield
                  - openAlexKeyword
                  - semanticScholar
        # Indhold
        abstract:
          type: string
        hasAbstract:
          type: boolean
        abstractSource:
          type: string
        abstractSections:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              label:
                type: string
              text:
                type: string
        abstractParagraphs:
          type: string
        aiSummary:
          type: string
        # Metrikker
        citationCount:
          type: integer
          nullable: true
        citationCountSource:
          type: string
          enum: ["", openAlex, semanticScholar]
        isOpenAccess:
          type: boolean
          nullable: true
        openAccessUrl:
          type: string
        isRetracted:
          type: boolean
          nullable: true
        # Tillid/proveniens
        trustedPmid:
          type: boolean
        canOpenInPubMed:
          type: boolean
        originSource:
          type: string
        mergedSources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
        openAlexId:
          type: string
          description: Short or full OpenAlex work id when known (additive; may be empty).
        ranking:
          type: object
          nullable: true
          additionalProperties: false
          description: >
            Optional additive rerank diagnostics from the unified/legacy candidate merge.
            Present only when score data exists. Reflects quality/RRF scores before any
            LLM finalRerank permutation of page order.
          properties:
            combinedScore:
              type: number
            bestRank:
              type: integer
            sourceCount:
              type: integer
            scoreTieBreaker:
              type: number
              nullable: true
            scoreBreakdown:
              type: object
              additionalProperties: true
            sourceBreakdown:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  source:
                    type: string
                  rank:
                    type: integer
                  score:
                    type: number
                    nullable: true
                  weight:
                    type: number
                    nullable: true
                  weightedRrf:
                    type: number
                    nullable: true
    RateLimit:
      type: object
      additionalProperties: false
      properties:
        limit:
          type: integer
          nullable: true
        remaining:
          type: integer
          nullable: true
        resetAt:
          type: string
        resetInSeconds:
          type: integer
          nullable: true
        status:
          type: integer
        isLimited:
          type: boolean
    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
        processDetails:
          type: object
          additionalProperties: true
          description: >-
            Kun til stede når responseOptions.includeProcessDetails=true og
            en collector fandtes før fejlen (typisk 422/5xx). Samme redigerede
            kontrakt som i success-svar.
